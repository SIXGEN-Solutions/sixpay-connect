    - id: "customer-subscription-management-api-v1"
      path: "documentation/contracts/internal/customer-subscription-management-api-v1.yaml"

excludedContracts:
  reason: "DEFERRED_FUTURE contracts are retained for traceability and excluded from active MVP generation context."
  entries:
    - id: "tresorpay-authorization-request-api-v1"
      path: "documentation/contracts/tresorpay/tresorpay-authorization-request-api-v1.yaml"
    - id: "tresorpay-authorization-decision-webhook-v1"
