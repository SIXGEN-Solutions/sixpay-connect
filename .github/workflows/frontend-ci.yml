name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Partner OpenAPI contract
        run: npm run contract:partner

      - name: Lint
        run: npm run lint

      - name: Unit, component and coverage tests
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > dependency-audit.json

      - name: Build integration, Netlify and production profiles
        run: npm run build:all

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: frontend/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/dist/frontend
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run standalone/mock E2E and accessibility
        run: npm run test:e2e

      - name: Run integration-profile E2E
        run: npm run test:e2e:integration

      - name: Upload mock Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload integration Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-integration-report
          path: frontend/playwright-report-integration
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-traces
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 14
