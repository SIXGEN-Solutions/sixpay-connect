name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Display build environment
        run: |
          java -version
          mvn --version

      - name: Compile and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-reports
          path: backend/**/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-application
          path: |
            backend/bootstrap/target/*.jar
            !backend/bootstrap/target/*.jar.original
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Display build environment
        run: |
          java -version
          mvn --version
          docker version

      - name: Run integration tests with coverage
        run: mvn --batch-mode --no-transfer-progress clean verify -Pfull-tests,coverage

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: backend/**/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed Testcontainers diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Backend dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
