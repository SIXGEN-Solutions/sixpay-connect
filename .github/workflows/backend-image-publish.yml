name: Backend image publish (GHCR)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify backend, build image and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Maven verification gate
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Passembled-tests clean verify

      - name: Normalize GHCR image repository
        shell: bash
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sixpay-backend" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=SIXPAY CONNECT backend

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "::error::No valid image digest returned by registry publication"
            exit 1
          fi
          echo "### Published image (use digest for deployment)" >> "$GITHUB_STEP_SUMMARY"
          printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
