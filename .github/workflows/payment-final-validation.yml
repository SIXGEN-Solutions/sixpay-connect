name: Payment Final Validation

on:
  pull_request:
    paths:
      - 'backend/payment/**'
      - 'backend/common/**'
      - 'backend/shared-kernel/**'
      - 'backend/security/**'
      - 'backend/pom.xml'
      - 'backend/sixpay-bom/**'
      - 'documentation/contracts/internal/payment-*.yaml'
      - 'documentation/ai/payment/**'
      - 'documentation/runbooks/payment/**'
      - 'scripts/validation/validate-payment-phase3.sh'
      - '.github/workflows/payment-final-validation.yml'
  push:
    branches:
      - main
      - develop
      - feat/backend-payment
    paths:
      - 'backend/payment/**'
      - 'documentation/contracts/internal/payment-*.yaml'
      - 'documentation/ai/payment/**'
      - 'documentation/runbooks/payment/**'
      - 'scripts/validation/validate-payment-phase3.sh'
      - '.github/workflows/payment-final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-final-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-final-validation:
    name: Payment Phase 3 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Display validation environment
        run: |
          java -version
          mvn --version
          docker version

      - name: Run Payment Phase 3 validation
        run: bash scripts/validation/validate-payment-phase3.sh

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-unit-test-reports
          path: backend/payment/target/surefire-reports
          if-no-files-found: error
          retention-days: 14

      - name: Upload integration-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-integration-test-reports
          path: backend/payment/target/failsafe-reports
          if-no-files-found: error
          retention-days: 14

      - name: Upload Payment coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-jacoco-report
          path: backend/payment/target/site/jacoco
          if-no-files-found: error
          retention-days: 14
