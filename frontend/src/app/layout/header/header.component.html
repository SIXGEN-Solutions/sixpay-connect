<mat-toolbar class="sp-header">
  <mat-icon aria-hidden="true">account_balance</mat-icon>

  <span class="sp-header__title"> SIXPAY CONNECT </span>

  <span class="sp-header__spacer"></span>

  @if (authentication.username(); as username) {
    <span class="sp-header__subject">
      {{ username }}
    </span>

    <button type="button" class="sp-header__logout" (click)="authentication.logout()">
      Déconnexion
    </button>
  }
</mat-toolbar>
