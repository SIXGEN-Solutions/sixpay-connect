<div class="sp-data-table" tabindex="0" role="region" [attr.aria-label]="caption()">
  <table mat-table [dataSource]="data()">
    <caption class="sp-visually-hidden">
      {{
        caption()
      }}
    </caption>

    @for (column of columns(); track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef scope="col">{{ column.label }}</th>
        <td mat-cell *matCellDef="let row">{{ cellValue(row, column.key) }}</td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell sp-data-table__empty" [attr.colspan]="displayedColumns().length">
        {{ emptyMessage() }}
      </td>
    </tr>
  </table>
</div>
