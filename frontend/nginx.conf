server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS on user-defined Docker networks. A missing backend
    # does not block Nginx startup. Actual API requests may return 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The official nginx entrypoint substitutes SIXPAY_BACKEND_UPSTREAM into
    # this template once at container startup. Nginx variables are preserved.
    set $sixpay_backend_upstream "${SIXPAY_BACKEND_UPSTREAM}";

    # Supplied by the deployment as a read-only mounted file, never baked into the image.
    location = /runtime-config.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }

    location /api/ {
        # Variable-based proxy_pass defers upstream resolution to request time.
        # No URI suffix: original /api/... path is preserved.
        proxy_pass http://$sixpay_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /internal/api/ {
        proxy_pass http://$sixpay_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
