name: sixpay-connect

services:

  postgres:
    image: postgres:16.3
    container_name: sixpay-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sixpay}
      POSTGRES_USER: ${POSTGRES_USER:-sixpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sixpay_dev}

    ports:
      - "${POSTGRES_PORT:-15432}:15432"

    volumes:
      - sixpay-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sixpay} -d ${POSTGRES_DB:-sixpay}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  sixpay-postgres-data: