name: sixpay-connect

services:
  postgres:
    image: postgres:15
    container_name: sixpay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sixpay}
      POSTGRES_USER: ${POSTGRES_USER:-sixpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sixpay_local_only}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - sixpay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sixpay} -d ${POSTGRES_DB:-sixpay}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: sixpay-connect-backend:local
    container_name: sixpay-backend
    environment:
      SPRING_PROFILES_ACTIVE: local-auth
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sixpay}?currentSchema=sixpay
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sixpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sixpay_local_only}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SIXPAY_SESSION_COOKIE_SECURE: "false"
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: sixpay-connect-frontend:local
    container_name: sixpay-frontend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sixpay-postgres-data:
