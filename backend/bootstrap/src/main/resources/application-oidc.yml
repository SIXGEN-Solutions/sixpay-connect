sixpay:
  security:
    # Transitional DA-2 compatibility switch used by the existing
    # resource-server SecurityFilterChain. DA-4 will compose the chain from
    # authentication capabilities directly.
    mode: oauth2
    authentication:
      local:
        enabled: false
      oidc:
        enabled: true
        registration-id: sixpay

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
