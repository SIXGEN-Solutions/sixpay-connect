# SIXPAY CONNECT - production, configuration autonome (aucun spring.config.import).
# T1: compensation Payment release/reversal desactivee; Accounting T1/TFJ aussi desactive par defaut.
# Prerequis: secrets externes, LDAPS, OAuth2 bancaire et mTLS provisionnes.
# Les clients OAuth2/SSL T1 sont volontairement absents tant que T1 reste desactive;
# leur activation necessite une decision explicite et leurs credentiels.
spring:
  application:
    name: sixpay-connect
  flyway:
    enabled: true
    schemas: sixpay
    default-schema: sixpay
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: true
  security:
    oauth2:
      client:
        provider:
          amplitude-payment:
            token-uri: ${AMPLITUDE_PAYMENT_OAUTH2_TOKEN_URI}
        registration:
          amplitude-payment:
            provider: amplitude-payment
            authorization-grant-type: client_credentials
            client-id: ${AMPLITUDE_PAYMENT_OAUTH2_CLIENT_ID}
            client-secret: ${AMPLITUDE_PAYMENT_OAUTH2_CLIENT_SECRET}
            scope: ${AMPLITUDE_PAYMENT_OAUTH2_SCOPE:amplitude.payment.confirmation,amplitude.payment.execution,amplitude.payment.execution.read}
  ssl:
    bundle:
      jks:
        amplitude-payment-client:
          keystore:
            location: ${AMPLITUDE_PAYMENT_KEYSTORE_LOCATION}
            password: ${AMPLITUDE_PAYMENT_KEYSTORE_PASSWORD}
            type: ${AMPLITUDE_PAYMENT_KEYSTORE_TYPE:PKCS12}
          truststore:
            location: ${AMPLITUDE_PAYMENT_TRUSTSTORE_LOCATION}
            password: ${AMPLITUDE_PAYMENT_TRUSTSTORE_PASSWORD}
            type: ${AMPLITUDE_PAYMENT_TRUSTSTORE_TYPE:PKCS12}
  datasource:
    url: ${SIXPAY_DB_URL}
    username: ${SIXPAY_DB_USERNAME}
    password: ${SIXPAY_DB_PASSWORD}
    hikari:
      schema: sixpay
      maximum-pool-size: ${SIXPAY_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${SIXPAY_DB_MIN_IDLE:5}
      connection-timeout: ${SIXPAY_DB_CONNECTION_TIMEOUT:20s}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: sixpay
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  messaging:
    transport: internal
    outbox:
      enabled: true
  security:
    local:
      password:
        min-length: ${SIXPAY_LOCAL_PASSWORD_MIN_LENGTH:12}
        max-length: ${SIXPAY_LOCAL_PASSWORD_MAX_LENGTH:200}
        history-size: ${SIXPAY_LOCAL_PASSWORD_HISTORY_SIZE:5}
        expiration-days: ${SIXPAY_LOCAL_PASSWORD_EXPIRATION_DAYS:90}
sixpay:
  security:
    m2m:
      # Enable only after verified mTLS gateway, Keycloak JWT and partner binding.
      enabled: ${SIXPAY_M2M_ENABLED:false}
      issuer-uri: ${SIXPAY_M2M_ISSUER_URI:}
      jwk-set-uri: ${SIXPAY_M2M_JWK_SET_URI:}
      audience: ${SIXPAY_M2M_AUDIENCE:}
    authentication:
      policy:
        require-provider: true
      local:
        enabled: ${SIXPAY_LOCAL_ENABLED:false}
      oidc:
        enabled: ${SIXPAY_OIDC_ENABLED:false}
      ldap:
        enabled: ${SIXPAY_LDAP_ENABLED:true}
        urls: ${SIXPAY_LDAP_URLS}
        base-dn: ${SIXPAY_LDAP_BASE_DN}
        user-search-base: ${SIXPAY_LDAP_USER_SEARCH_BASE}
        user-search-filter: ${SIXPAY_LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
        login-attribute: ${SIXPAY_LDAP_LOGIN_ATTRIBUTE:sAMAccountName}
        username-attribute: ${SIXPAY_LDAP_USERNAME_ATTRIBUTE:sAMAccountName}
        subject-attribute: ${SIXPAY_LDAP_SUBJECT_ATTRIBUTE:objectGUID}
        trust-domain: ${SIXPAY_LDAP_TRUST_DOMAIN:regionale-ldap}
        service-account-dn: ${SIXPAY_LDAP_SERVICE_ACCOUNT_DN}
        service-account-password: ${SIXPAY_LDAP_SERVICE_ACCOUNT_PASSWORD}
        connect-timeout: ${SIXPAY_LDAP_CONNECT_TIMEOUT:3s}
        read-timeout: ${SIXPAY_LDAP_READ_TIMEOUT:5s}
        authentication-timeout: ${SIXPAY_LDAP_AUTHENTICATION_TIMEOUT:10s}
  payment:
    treasury:
      enabled: ${SIXPAY_PAYMENT_TREASURY_ENABLED:true}
      # Deny by default. An authorized deployment must explicitly supply
      # institution -> approved version(s) via its configuration overlay.
      approval:
        approved-versions-by-institution:
          REGIONAL:
            - "v1"
      accounts:
        REGIONAL:
          AVI:
            configuration-id: TREASURY-BANK-CM-AVI
            account-reference: ${TREASURY_BANK_CM_AVI_ACCOUNT_REF:}
            version: "v1"

          IM7:
            configuration-id: TREASURY-BANK-CM-IM7
            account-reference: ${TREASURY_BANK_CM_IM7_ACCOUNT_REF:}
            version: "v1"

          RNF:
            configuration-id: TREASURY-BANK-CM-RNF
            account-reference: ${TREASURY_BANK_CM_RNF_ACCOUNT_REF:}
            version: "v1"
    banking:
      amplitude:
        reservation:
          enabled: ${AMPLITUDE_FUNDS_RESERVATION_ENABLED:true}
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
          reservation-path: ${AMPLITUDE_FUNDS_RESERVATION_PATH:/v1/payment/funds/reservations}
          connect-timeout: ${AMPLITUDE_FUNDS_RESERVATION_CONNECT_TIMEOUT:2s}
          read-timeout: ${AMPLITUDE_FUNDS_RESERVATION_READ_TIMEOUT:5s}
          security:
            oauth2-enabled: ${AMPLITUDE_FUNDS_RESERVATION_OAUTH2_ENABLED:true}
            mtls-enabled: ${AMPLITUDE_FUNDS_RESERVATION_MTLS_ENABLED:true}
            allow-insecure-http: ${AMPLITUDE_FUNDS_RESERVATION_ALLOW_INSECURE_HTTP:false}
            oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
            ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
          contract:
            version: ${AMPLITUDE_FUNDS_RESERVATION_CONTRACT_VERSION:provisional-v1}
            reserved-codes:
              - ${AMPLITUDE_FUNDS_RESERVED_CODE:00}
            rejected-codes:
              - ${AMPLITUDE_FUNDS_INSUFFICIENT_CODE:04}
              - ${AMPLITUDE_FUNDS_ACCOUNT_BLOCKED_CODE:02}
              - ${AMPLITUDE_FUNDS_ACCOUNT_OPPOSED_CODE:03}
              - ${AMPLITUDE_FUNDS_LIMIT_EXCEEDED_CODE:05}
            idempotency-header: ${AMPLITUDE_FUNDS_IDEMPOTENCY_HEADER:Idempotency-Key}
        posting:
          enabled: ${AMPLITUDE_POSTING_ENABLED:true}
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
          posting-path: ${AMPLITUDE_POSTING_PATH:/api/v1/payment-events}
          payment-reference-lookup-path: ${AMPLITUDE_POSTING_PAYMENT_REFERENCE_LOOKUP_PATH:/api/v1/payment-events/{paymentReference}}
          idempotency-lookup-path: ${AMPLITUDE_POSTING_IDEMPOTENCY_LOOKUP_PATH:/api/v1/payment-events/idempotency/{idempotencyKey}}
          connect-timeout: ${AMPLITUDE_POSTING_CONNECT_TIMEOUT:2s}
          read-timeout: ${AMPLITUDE_POSTING_READ_TIMEOUT:10s}
          security:
            oauth2-enabled: ${AMPLITUDE_POSTING_OAUTH2_ENABLED:true}
            mtls-enabled: ${AMPLITUDE_POSTING_MTLS_ENABLED:true}
            allow-insecure-http: ${AMPLITUDE_POSTING_ALLOW_INSECURE_HTTP:false}
            oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
            ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
          contract:
            version: ${AMPLITUDE_POSTING_CONTRACT_VERSION:1.0.0}
            idempotency-header: ${AMPLITUDE_POSTING_IDEMPOTENCY_HEADER:Idempotency-Key}
            correlation-header: ${AMPLITUDE_POSTING_CORRELATION_HEADER:X-Correlation-ID}
            institution-header: ${AMPLITUDE_POSTING_INSTITUTION_HEADER:X-Financial-Institution-Code}
        compensation:
          enabled: ${AMPLITUDE_COMPENSATION_ENABLED:false}
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
          release-path: ${AMPLITUDE_FUNDS_RELEASE_PATH:/v1/payment/funds/releases}
          reversal-path: ${AMPLITUDE_REVERSAL_PATH:/v1/payment/reversals}
          connect-timeout: ${AMPLITUDE_COMPENSATION_CONNECT_TIMEOUT:2s}
          read-timeout: ${AMPLITUDE_COMPENSATION_READ_TIMEOUT:10s}
          security:
            oauth2-enabled: ${AMPLITUDE_COMPENSATION_OAUTH2_ENABLED:true}
            mtls-enabled: ${AMPLITUDE_COMPENSATION_MTLS_ENABLED:true}
            allow-insecure-http: ${AMPLITUDE_COMPENSATION_ALLOW_INSECURE_HTTP:false}
            oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
            ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
          contract:
            version: ${AMPLITUDE_COMPENSATION_CONTRACT_VERSION:provisional-v1}
            idempotency-header: ${AMPLITUDE_COMPENSATION_IDEMPOTENCY_HEADER:Idempotency-Key}
            release-success-codes: ["00", "01"]
            release-rejected-codes: ["10"]
            reversal-success-codes: ["00"]
            reversal-rejected-codes: ["10"]
            reversal-not-allowed-codes: ["11"]
        status:
          enabled: ${AMPLITUDE_POSTING_STATUS_ENABLED:false}
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
          by-idempotency-path: ${AMPLITUDE_POSTING_STATUS_BY_IDEMPOTENCY_PATH:/v1/payment/postings/idempotency/{lookupValue}}
          by-bank-reference-path: ${AMPLITUDE_POSTING_STATUS_BY_BANK_REFERENCE_PATH:/v1/payment/postings/reference/{lookupValue}}
          connect-timeout: ${AMPLITUDE_POSTING_STATUS_CONNECT_TIMEOUT:2s}
          read-timeout: ${AMPLITUDE_POSTING_STATUS_READ_TIMEOUT:5s}
          security:
            oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
            ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
        confirmation:
          enabled: ${AMPLITUDE_CONFIRMATION_ENABLED:true}
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
          create-path: ${AMPLITUDE_CONFIRMATION_CREATE_PATH:/api/v1/payment-confirmation-challenges}
          challenge-path: ${AMPLITUDE_CONFIRMATION_CHALLENGE_PATH:/api/v1/payment-confirmation-challenges/{challengeReference}}
          verification-path: ${AMPLITUDE_CONFIRMATION_VERIFICATION_PATH:/api/v1/payment-confirmation-challenges/{challengeReference}/verifications}
          replacement-path: ${AMPLITUDE_CONFIRMATION_REPLACEMENT_PATH:/api/v1/payment-confirmation-challenges/{challengeReference}/replacements}
          lookup-by-idempotency-path: ${AMPLITUDE_CONFIRMATION_LOOKUP_BY_IDEMPOTENCY_PATH:/api/v1/payment-confirmation-challenge-lookups/{idempotencyKey}}
          revocation-path: ${AMPLITUDE_CONFIRMATION_REVOCATION_PATH:/api/v1/payment-confirmation-challenges/{challengeReference}/revocations}
          connect-timeout: ${AMPLITUDE_CONFIRMATION_CONNECT_TIMEOUT}
          read-timeout: ${AMPLITUDE_CONFIRMATION_READ_TIMEOUT}
          security:
            oauth2-enabled: ${AMPLITUDE_CONFIRMATION_OAUTH2_ENABLED:true}
            mtls-enabled: ${AMPLITUDE_CONFIRMATION_MTLS_ENABLED:true}
            allow-insecure-http: ${AMPLITUDE_CONFIRMATION_ALLOW_INSECURE_HTTP:false}
            oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
            ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
          contract:
            idempotency-header: ${AMPLITUDE_CONFIRMATION_IDEMPOTENCY_HEADER:Idempotency-Key}
            correlation-header: ${AMPLITUDE_CONFIRMATION_CORRELATION_HEADER:X-Correlation-ID}
            institution-header: ${AMPLITUDE_CONFIRMATION_INSTITUTION_HEADER:X-Financial-Institution-Code}
    t0-recovery:
      enabled: false
      batch-size: 50
      window: PT48H
      minimum-age: PT2M
      claim-timeout: PT5M
      poll-delay: PT2M
    outbox:
      customer-projection:
        enabled: true
        batch-size: 50
        polling-interval: 1s
        max-attempts: 10
        initial-backoff: 1s
        max-backoff: 5m
        processing-timeout: 2m
    callback:
      enabled: ${SIXPAY_PAYMENT_CALLBACK_ENABLED:true}
      signing-key-id: ${SIXPAY_PAYMENT_CALLBACK_SIGNING_KEY_ID}
      signing-secret: ${SIXPAY_PAYMENT_CALLBACK_SIGNING_SECRET}
  accounting:
    batch:
      cutoff-zone: ${SIXPAY_ACCOUNTING_CUTOFF_ZONE:Africa/Douala}
      cutoff-time: ${SIXPAY_ACCOUNTING_CUTOFF_TIME:23:00}
    api:
      enabled: ${SIXPAY_ACCOUNTING_API_ENABLED:false}
      base-url: ${ACCOUNTING_API_BASE_URL:https://accounting-api.invalid}
      submit-path: ${ACCOUNTING_API_SUBMIT_PATH:/api/v1/accounting-entries}
      batch-lookup-path: ${ACCOUNTING_API_BATCH_LOOKUP_PATH:/api/v1/accounting-entries/batches/{batchId}}
      idempotency-lookup-path: ${ACCOUNTING_API_IDEMPOTENCY_LOOKUP_PATH:/api/v1/accounting-entries/idempotency/{idempotencyKey}}
      connect-timeout: ${ACCOUNTING_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${ACCOUNTING_API_READ_TIMEOUT:5s}
      security:
        oauth2-registration-id: ${ACCOUNTING_API_OAUTH2_REGISTRATION_ID:accounting-api}
        ssl-bundle: ${ACCOUNTING_API_SSL_BUNDLE:accounting-api-client}
      contract:
        idempotency-header: ${ACCOUNTING_API_IDEMPOTENCY_HEADER:Idempotency-Key}
    tfj:
      lookup:
        enabled: ${AMPLITUDE_TFJ_LOOKUP_ENABLED:false}
        base-url: ${AMPLITUDE_TFJ_BASE_URL:https://amplitude-tfj.invalid}
        lookup-path: ${AMPLITUDE_TFJ_LOOKUP_PATH:/api/v1/end-of-day-confirmations}
        connect-timeout: ${AMPLITUDE_TFJ_CONNECT_TIMEOUT:2s}
        read-timeout: ${AMPLITUDE_TFJ_READ_TIMEOUT:5s}
        security:
          oauth2-registration-id: ${AMPLITUDE_TFJ_OAUTH2_REGISTRATION_ID:amplitude-tfj}
          ssl-bundle: ${AMPLITUDE_TFJ_SSL_BUNDLE:amplitude-tfj-client}
      webhook:
        enabled: ${AMPLITUDE_TFJ_WEBHOOK_ENABLED:false}
        signature-keys-base64: {}
    tresorpay-status:
      enabled: ${SIXPAY_ACCOUNTING_TRESORPAY_STATUS_ENABLED:false}
      base-url: ${TRESORPAY_STATUS_BASE_URL:https://tresorpay.invalid}
      status-path: ${TRESORPAY_STATUS_PATH:/api/v1/payments/{reference}/status}
      connect-timeout: ${TRESORPAY_STATUS_CONNECT_TIMEOUT:2s}
      read-timeout: ${TRESORPAY_STATUS_READ_TIMEOUT:5s}
      security:
        oauth2-registration-id: ${TRESORPAY_STATUS_OAUTH2_REGISTRATION_ID:tresorpay-status}
        ssl-bundle: ${TRESORPAY_STATUS_SSL_BUNDLE:tresorpay-status-client}
  reporting:
    audit-query:
      cursor-hmac-key: ${SIXPAY_REPORTING_AUDIT_CURSOR_HMAC_KEY}
    audit-export:
      storage-directory: ${SIXPAY_REPORTING_AUDIT_EXPORT_STORAGE_DIRECTORY:/var/lib/sixpay/audit-exports}
      retrieval-base-uri: ${SIXPAY_REPORTING_AUDIT_EXPORT_RETRIEVAL_BASE_URI}
  customer:
    verification:
      banking:
        enabled: ${CUSTOMER_VERIFICATION_BANKING_ENABLED:true}
        base-url: ${CORE_BANKING_BASE_URL}
        endpoint-path: ${CORE_BANKING_CUSTOMER_VERIFICATION_PATH:/api/v1/customer-verifications}
        connect-timeout: ${CORE_BANKING_CONNECT_TIMEOUT:2s}
        read-timeout: ${CORE_BANKING_READ_TIMEOUT:5s}
        max-attempts: ${CORE_BANKING_MAX_ATTEMPTS:3}
        retry-backoff: ${CORE_BANKING_RETRY_BACKOFF:250ms}
        evidence-ttl: ${CORE_BANKING_EVIDENCE_TTL:5m}
        contract:
          version: ${CORE_BANKING_CUSTOMER_VERIFICATION_CONTRACT_VERSION:1.0.0}
          success-codes:
            - ${CORE_BANKING_SUCCESS_CODE:00}
          business-failure-codes:
            - ${CORE_BANKING_CUSTOMER_NOT_FOUND_CODE:01}
            - ${CORE_BANKING_ACCOUNT_NOT_FOUND_CODE:02}
            - ${CORE_BANKING_ACCOUNT_BLOCKED_CODE:03}
            - ${CORE_BANKING_ACCOUNT_OPPOSED_CODE:04}
    observation:
      persistence:
        enabled: true
        protection-key-base64: ${SIXPAY_CUSTOMER_OBSERVATION_PROTECTION_KEY_BASE64}
      query:
        enabled: true
        cursor-key-base64: ${SIXPAY_CUSTOMER_OBSERVATION_CURSOR_KEY_BASE64}
      audit:
        persistence:
          enabled: true
  notification:
    operational:
      retry:
        enabled: ${SIXPAY_NOTIFICATION_OPERATIONAL_RETRY_ENABLED:true}
        max-attempts: ${SIXPAY_NOTIFICATION_OPERATIONAL_MAX_ATTEMPTS:5}
        initial-backoff: ${SIXPAY_NOTIFICATION_OPERATIONAL_INITIAL_BACKOFF:30s}
        max-backoff: ${SIXPAY_NOTIFICATION_OPERATIONAL_MAX_BACKOFF:15m}
        batch-size: ${SIXPAY_NOTIFICATION_OPERATIONAL_BATCH_SIZE:50}
        poll-interval-ms: ${SIXPAY_NOTIFICATION_OPERATIONAL_POLL_INTERVAL_MS:30000}
    email:
      mode: ${SIXPAY_NOTIFICATION_EMAIL_MODE:logging}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SIXPAY_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: strict
        secure: ${SIXPAY_SESSION_COOKIE_SECURE:true}
