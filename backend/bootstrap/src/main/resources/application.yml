server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sixpay-connect

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: sixpay
    default-schema: sixpay
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

sixpay:
  messaging:
    transport: internal
    outbox:
      enabled: true

  customer:
    verification:
      banking:
        enabled: ${CUSTOMER_VERIFICATION_BANKING_ENABLED:false}

  security:
    local:
      password:
        min-length: ${SIXPAY_LOCAL_PASSWORD_MIN_LENGTH:12}
        max-length: ${SIXPAY_LOCAL_PASSWORD_MAX_LENGTH:200}
        history-size: ${SIXPAY_LOCAL_PASSWORD_HISTORY_SIZE:5}
        expiration-days: ${SIXPAY_LOCAL_PASSWORD_EXPIRATION_DAYS:90}
