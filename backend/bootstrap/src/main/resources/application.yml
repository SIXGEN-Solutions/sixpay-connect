server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sixpay-connect

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: sixpay
    default-schema: sixpay
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

sixpay:
  payment:
    treasury:
      # Fail closed when disabled. Enable only when banking client credentials
      # and the three real account references are configured for the environment.
      enabled: ${SIXPAY_PAYMENT_TREASURY_ENABLED:false}
      accounts:
        BANK_CM:
          AVI:
            configuration-id: TREASURY-BANK-CM-AVI
            account-reference: ${TREASURY_BANK_CM_AVI_ACCOUNT_REF:}
            version: "v1"
          IM7:
            configuration-id: TREASURY-BANK-CM-IM7
            account-reference: ${TREASURY_BANK_CM_IM7_ACCOUNT_REF:}
            version: "v1"
          RNF:
            configuration-id: TREASURY-BANK-CM-RNF
            account-reference: ${TREASURY_BANK_CM_RNF_ACCOUNT_REF:}
            version: "v1"

  messaging:
    transport: internal
    outbox:
      enabled: true

  security:
    local:
      password:
        min-length: ${SIXPAY_LOCAL_PASSWORD_MIN_LENGTH:12}
        max-length: ${SIXPAY_LOCAL_PASSWORD_MAX_LENGTH:200}
        history-size: ${SIXPAY_LOCAL_PASSWORD_HISTORY_SIZE:5}
        expiration-days: ${SIXPAY_LOCAL_PASSWORD_EXPIRATION_DAYS:90}
