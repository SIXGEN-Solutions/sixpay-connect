spring:
  config:
    import:
      - classpath:config/security/ldap-common.yml
      - classpath:application-payment-banking-capabilities.yml

  datasource:
    url: ${SIXPAY_DB_URL}
    username: ${SIXPAY_DB_USERNAME}
    password: ${SIXPAY_DB_PASSWORD}

sixpay:
  reporting:
    audit-export:
      storage-directory: ${SIXPAY_REPORTING_AUDIT_EXPORT_STORAGE_DIRECTORY:/var/lib/sixpay/audit-exports}
      retrieval-base-uri: ${SIXPAY_REPORTING_AUDIT_EXPORT_RETRIEVAL_BASE_URI:https://audit-artifacts.preproduction.local/}
      retention: ${SIXPAY_REPORTING_AUDIT_EXPORT_RETENTION:PT1H}
    audit-query:
      cursor-hmac-key: ${SIXPAY_REPORTING_AUDIT_CURSOR_HMAC_KEY}
  security:
    authentication:
      local:
        enabled: false
      oidc:
        enabled: false
      ldap:
        enabled: true
    bootstrap:
      ldap-admin:
        enabled: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_ENABLED:false}
        user-id: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_USER_ID:}
        username: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_USERNAME:}
        email: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_EMAIL:}
        trust-domain: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_TRUST_DOMAIN:}
        stable-subject: ${SIXPAY_LDAP_ADMIN_BOOTSTRAP_STABLE_SUBJECT:}
  payment:
    banking:
      amplitude:
        confirmation:
          base-url: ${AMPLITUDE_PAYMENT_BASE_URL:http://host.docker.internal:9092}
          connect-timeout: ${AMPLITUDE_CONFIRMATION_CONNECT_TIMEOUT:2s}
          read-timeout: ${AMPLITUDE_CONFIRMATION_READ_TIMEOUT:10s}
