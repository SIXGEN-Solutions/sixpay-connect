spring:
  datasource:
    url: ${SIXPAY_DB_URL:jdbc:postgresql://localhost:5432/sixpaydb?currentSchema=sixpay}
    username: ${SIXPAY_DB_USERNAME:sixpay_user}
    password: ${SIXPAY_DB_PASSWORD:sixpay_password}

    hikari:
      schema: sixpay
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
      default_schema: sixpay
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: sixpay
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,mappings

sixpay:
  security:
    mode: standalone

  messaging:
    transport: internal
    outbox:
      enabled: true

  notification:
    email:
      mode: logging
      from: no-reply@sixpay.local
      subject-prefix: "[SIXPAY]"