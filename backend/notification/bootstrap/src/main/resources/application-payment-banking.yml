spring:
  security:
    oauth2:
      client:
        provider:
          amplitude-payment:
            token-uri: ${AMPLITUDE_PAYMENT_OAUTH2_TOKEN_URI}
        registration:
          amplitude-payment:
            provider: amplitude-payment
            authorization-grant-type: client_credentials
            client-id: ${AMPLITUDE_PAYMENT_OAUTH2_CLIENT_ID}
            client-secret: ${AMPLITUDE_PAYMENT_OAUTH2_CLIENT_SECRET}
            scope: ${AMPLITUDE_PAYMENT_OAUTH2_SCOPE:account.verify funds.read}

  ssl:
    bundle:
      jks:
        amplitude-payment-client:
          keystore:
            location: ${AMPLITUDE_PAYMENT_KEYSTORE_LOCATION}
            password: ${AMPLITUDE_PAYMENT_KEYSTORE_PASSWORD}
            type: ${AMPLITUDE_PAYMENT_KEYSTORE_TYPE:PKCS12}
          truststore:
            location: ${AMPLITUDE_PAYMENT_TRUSTSTORE_LOCATION}
            password: ${AMPLITUDE_PAYMENT_TRUSTSTORE_PASSWORD}
            type: ${AMPLITUDE_PAYMENT_TRUSTSTORE_TYPE:PKCS12}

sixpay:
  payment:
    banking:
      amplitude:
        enabled: ${AMPLITUDE_PAYMENT_BANKING_ENABLED:true}
        base-url: ${AMPLITUDE_PAYMENT_BASE_URL}
        verification-path: ${AMPLITUDE_PAYMENT_VERIFICATION_PATH:/v1/payment/accounts/verify}
        funds-path: ${AMPLITUDE_PAYMENT_FUNDS_PATH:/v1/payment/accounts/funds-check}
        connect-timeout: ${AMPLITUDE_PAYMENT_CONNECT_TIMEOUT:2s}
        read-timeout: ${AMPLITUDE_PAYMENT_READ_TIMEOUT:5s}
        evidence-ttl: ${AMPLITUDE_PAYMENT_EVIDENCE_TTL:5m}
        security:
          oauth2-registration-id: ${AMPLITUDE_PAYMENT_OAUTH2_REGISTRATION_ID:amplitude-payment}
          ssl-bundle: ${AMPLITUDE_PAYMENT_SSL_BUNDLE:amplitude-payment-client}
        contract:
          version: ${AMPLITUDE_PAYMENT_CONTRACT_VERSION:provisional-v1}
          success-codes:
            - ${AMPLITUDE_PAYMENT_SUCCESS_CODE:00}
          rejection-codes:
            - ${AMPLITUDE_PAYMENT_ACCOUNT_NOT_FOUND_CODE:01}
            - ${AMPLITUDE_PAYMENT_ACCOUNT_BLOCKED_CODE:02}
            - ${AMPLITUDE_PAYMENT_ACCOUNT_OPPOSED_CODE:03}
            - ${AMPLITUDE_PAYMENT_INSUFFICIENT_FUNDS_CODE:04}
