<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activation de votre accès SIXPAY CONNECT</title>
</head>
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="background:#f4f6f8;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0"
                   cellpadding="0"
                   style="max-width:640px;background:#ffffff;border-radius:8px;
                   border:1px solid #e5e7eb;">
                <tr>
                    <td style="padding:24px;background:#0f766e;color:#ffffff;
                               border-radius:8px 8px 0 0;">
                        <h1 style="margin:0;font-size:22px;">SIXPAY CONNECT</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 24px;">
                        <h2 style="margin-top:0;color:#0f766e;">
                            Votre accès est actif
                        </h2>
                        <p>Bonjour,</p>
                        <p>
                            Votre accès partenaire SIXPAY CONNECT est
                            maintenant actif.
                        </p>
                        <table role="presentation" width="100%"
                               cellspacing="0" cellpadding="0"
                               style="margin:24px 0;background:#f8fafc;
                                      border-left:4px solid #0f766e;">
                            <tr>
                                <td style="padding:16px;">
                                    <strong>Identifiant partenaire :</strong>
                                    {{partnerId}}<br>
                                    <strong>Référence de suivi :</strong>
                                    {{correlationId}}
                                </td>
                            </tr>
                        </table>
                        <p>
                            Vous pouvez désormais utiliser les services
                            autorisés de la plateforme.
                        </p>
                        <p style="margin-bottom:0;">
                            Cordialement,<br>
                            L’équipe SIXPAY CONNECT
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
