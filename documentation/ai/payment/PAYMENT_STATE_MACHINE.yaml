globalForbiddenTransitions:
  - id: "PAY-FORB-001"
    from:
      - "REJECTED"
      - "FAILED"
      - "TREASURY_INTEGRATED"
      - "REVERSED"
    to: "*"
    reason: "Terminal states cannot be reopened; identical fact replay is a no-op."

  - id: "PAY-FORB-002"
    from: "*"
    to: "TREASURY_INTEGRATED"
    exceptFrom:
      - "PENDING_END_OF_DAY_CONFIRMATION"
    reason: "Treasury finality requires a matched successful TFJ result."

  - id: "PAY-FORB-003"
    from:
      - "RECEIVED"
      - "AUTHORIZATION_CHECKING"
      - "BANKING_CHECKING"
      - "REJECTED"
    to:
      - "DEBITED"
      - "CUT_CREDITED"
      - "NOTIFIED"
      - "PENDING_END_OF_DAY_CONFIRMATION"
      - "TREASURY_INTEGRATED"
    reason: "No financial success is possible before approval and posting."

  - id: "PAY-FORB-004"
    from:
      - "ACCOUNTING_OUTCOME_UNKNOWN"
      - "REVERSAL_REQUIRED"
      - "REVERSAL_PENDING"
    to:
      - "APPROVED"
      - "POSTING"
    reason: "Unknown or partial financial effects cannot restart the original posting."

  - id: "PAY-FORB-005"
    from: "*"
    to: "REJECTED"
    exceptFrom:
      - "AUTHORIZATION_CHECKING"
      - "BANKING_CHECKING"
    reason: "Business rejection is only valid before any posting."

  - id: "PAY-FORB-006"
    from: "*"
    to: "FAILED"
    rule: "Forbidden whenever a financial effect is possible or not conclusively excluded."
    reason: "FAILED means proven absence of financial effect."

  - id: "PAY-FORB-007"
    from: "*"
    to: "NOTIFIED"
    exceptFrom:
      - "CUT_CREDITED"
    reason: "NOTIFIED represents the successful-posting immediate notification intent."

  - id: "PAY-FORB-008"
    from: "*"
    to: "REVERSAL_PENDING"
    exceptFrom:
      - "REVERSAL_REQUIRED"
    reason: "Every reversal requires explicit authorization and a distinct idempotency key."

  - id: "PAY-FORB-009"
    from: "*"
    to: "REVERSED"
    exceptFrom:
      - "REVERSAL_PENDING"
      - "ACCOUNTING_OUTCOME_UNKNOWN"
    reason: "REVERSED requires a confirmed authorized reversal."

  - id: "PAY-FORB-010"
    from: "*"
    to: "*"
    rule: "A notification delivery outcome alone cannot trigger a Payment transition."
    reason: "Financial truth and delivery truth are separate."

