      key: "institution + businessDate + bankPostingReference + tfjStatus"
      duplicateResult: "Return TREASURY_INTEGRATED without a second logical notification."

  - id: "PAY-TR-030"
    from: "PENDING_END_OF_DAY_CONFIRMATION"
