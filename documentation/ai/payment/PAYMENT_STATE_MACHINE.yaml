schemaVersion: "1.0.0"
document:
  id: "SIXPAY-PAYMENT-STATE-MACHINE"
  title: "SIXPAY CONNECT — Normative Payment State Machine"
  gate: "IA-0P — Payment Preflight"
  step: "0P.6 — Fermer la machine à états Payment"
  branch: "feat/payment-contract-pack"
  sourceCommit: "0faa8437e479a6397d049496edcacf7b1dbfde8b"
  status: "STATE_MACHINE_CLOSED"
  normative: true
  codeGenerationAllowed: false
  nextStep: "0P.7 — Formaliser les invariants Payment"

references:
  - path: "documentation/ai/payment/PAYMENT_SOURCE_BASELINE.md"
    role: "Normalized requirements and source hierarchy"
  - path: "documentation/ai/payment/PAYMENT_CONTEXT_MAP.md"
    role: "System and module ownership"
  - path: "documentation/ai/payment/PAYMENT_BUSINESS_FLOWS.md"
    role: "Nominal and alternative flows"
  - path: "documentation/ai/payment/PAYMENT_DOMAIN_MODEL.md"
    role: "Aggregate boundary and canonical snapshots"
  - path: "documentation/ai/customer/IA_0R_BLOCKING_DECISIONS.yaml"
    role: "Unknown accounting outcome, reversal and TFJ decisions"

semantics:
  aggregate: "Payment"
  stateOwner: "SIXPAY_PAYMENT"
  initialState: "RECEIVED"
  terminalStates:
    - "REJECTED"
    - "TREASURY_INTEGRATED"
    - "FAILED"
    - "REVERSED"
  authorizationChecking:
    meaning: "SIXPAY request admissibility and processing authorization"
    includes:
      - "Canonical request semantic validation"
      - "Partner and channel authorization already translated by Integration"
      - "Institution and controlled configuration eligibility"
      - "Business idempotency conflict detection"
    excludes:
      - "Local subscription lookup"
      - "TRESOR PAY subscription validation"
      - "Customer KYC decision"
  notified:
    meaning: "The immediate-result notification intent is durably registered in the Transactional Outbox"
    doesNotMean:
      - "TRESOR PAY has acknowledged HTTP delivery"
      - "The payment is financially final"
      - "The TFJ result is confirmed"
  financialFinality:
    immediatePostingState: "CUT_CREDITED"
    treasuryFinalityState: "TREASURY_INTEGRATED"
    rule: "Only a matched successful Amplitude TFJ result can establish Treasury finality"
  deliveryIndependence:
    rule: "Notification delivery status never changes the financial state of Payment"
    owner: "SIXPAY_NOTIFICATION"

stateCategories:
  intake:
    - "RECEIVED"
    - "AUTHORIZATION_CHECKING"
  bankingDecision:
    - "BANKING_CHECKING"
    - "REJECTED"
    - "APPROVED"
  financialExecution:
    - "POSTING"
    - "ACCOUNTING_OUTCOME_UNKNOWN"
    - "DEBITED"
    - "CUT_CREDITED"
    - "REVERSAL_REQUIRED"
    - "REVERSAL_PENDING"
    - "REVERSED"
    - "FAILED"
  notificationAndFinality:
    - "NOTIFIED"
    - "PENDING_END_OF_DAY_CONFIRMATION"
    - "TREASURY_INTEGRATED"

states:
  RECEIVED:
    description: "The authenticated request is durably recorded before any Amplitude call."
    terminal: false
    financialEffectPossible: false
    requiredFacts:
      - "PaymentId"
      - "TresorPayRequestId"
      - "PaymentReference"
      - "IdempotencyKey"
      - "RequestFingerprint"
      - "CorrelationId"
      - "Money"
      - "FinancialInstitutionCode"
      - "BankAccountReference"
      - "PayerSnapshot"
    allowedNextStates:
      - "AUTHORIZATION_CHECKING"

  AUTHORIZATION_CHECKING:
    description: "SIXPAY checks request admissibility; no local subscription is consulted."
    terminal: false
    financialEffectPossible: false
    allowedNextStates:
      - "BANKING_CHECKING"
      - "REJECTED"
      - "FAILED"

  BANKING_CHECKING:
    description: "Fresh Amplitude-backed customer, account, status, restriction and funds checks are in progress."
    terminal: false
    financialEffectPossible: false
    allowedNextStates:
      - "BANKING_CHECKING"
      - "REJECTED"
      - "APPROVED"
      - "FAILED"

  REJECTED:
    description: "A stable business reason rejects the payment before any financial write."
    terminal: true
    financialEffectPossible: false
    allowedNextStates: []

  APPROVED:
    description: "All required banking checks are favorable and fresh; posting may be requested once."
    terminal: false
    financialEffectPossible: false
    allowedNextStates:
      - "POSTING"
      - "FAILED"

  POSTING:
    description: "A unique idempotent debit-and-CUT-credit instruction has been durably authorized and submitted."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "DEBITED"
      - "CUT_CREDITED"
      - "ACCOUNTING_OUTCOME_UNKNOWN"
      - "REVERSAL_REQUIRED"
      - "FAILED"

  ACCOUNTING_OUTCOME_UNKNOWN:
    description: "SIXPAY cannot prove the complete result of a posting or reversal and must reconcile without blind replay."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "ACCOUNTING_OUTCOME_UNKNOWN"
      - "DEBITED"
      - "CUT_CREDITED"
      - "REVERSAL_REQUIRED"
      - "FAILED"
      - "REVERSED"

  REVERSAL_REQUIRED:
    description: "A confirmed or reconciled financial anomaly requires an explicit bank reversal."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "REVERSAL_PENDING"

  DEBITED:
    description: "The customer debit is confirmed while the CUT credit is not yet confirmed."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "CUT_CREDITED"
      - "ACCOUNTING_OUTCOME_UNKNOWN"
      - "REVERSAL_REQUIRED"

  CUT_CREDITED:
    description: "Customer debit and accounting credit of the configured CUT are confirmed; TFJ finality is not."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "NOTIFIED"

  NOTIFIED:
    description: "The immediate-result notification intent is committed to Outbox; delivery remains owned by Notification."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "PENDING_END_OF_DAY_CONFIRMATION"

  PENDING_END_OF_DAY_CONFIRMATION:
    description: "Immediate posting is known and Payment awaits a matched Amplitude TFJ result."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "PENDING_END_OF_DAY_CONFIRMATION"
      - "TREASURY_INTEGRATED"
      - "REVERSAL_REQUIRED"

  TREASURY_INTEGRATED:
    description: "A matched successful TFJ result is durably persisted and Treasury finality is established."
    terminal: true
    financialEffectPossible: true
    allowedNextStates: []

  FAILED:
    description: "Processing ended with proven absence of financial effect."
    terminal: true
    financialEffectPossible: false
    allowedNextStates: []

  REVERSAL_PENDING:
    description: "An explicitly authorized, separately idempotent bank reversal is awaiting a known outcome."
    terminal: false
    financialEffectPossible: true
    allowedNextStates:
      - "REVERSAL_REQUIRED"
      - "ACCOUNTING_OUTCOME_UNKNOWN"
      - "REVERSED"

  REVERSED:
    description: "The bank reversal is confirmed and linked to the original posting."
    terminal: true
    financialEffectPossible: true
    allowedNextStates: []

replayDefaults:
  duplicateEvent:
    sameEventIdAndPayload: "NO_OP_RETURN_CURRENT_STATE"
    sameEventIdDifferentPayload: "REJECT_CONFLICT_AND_AUDIT"
  staleCommand:
    rule: "REJECT_IF_EXPECTED_AGGREGATE_VERSION_DOES_NOT_MATCH"
  terminalState:
    sameFactReplay: "NO_OP"
    newStateChangingCommand: "REJECT"
  outbox:
    rule: "A replay may republish an existing event identifier but must not repeat the domain transition."
  financialWrite:
    rule: "NEVER_BLINDLY_REPLAY_AFTER_UNKNOWN_OUTCOME"

transitions:
  - id: "PAY-TR-001"
    from: "RECEIVED"
    trigger:
      kind: "COMMAND"
      name: "StartAuthorizationChecks"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "The request is durably persisted."
      - "All mandatory canonical identifiers and immutable request facts exist."
      - "No idempotency conflict is recorded."
    to: "AUTHORIZATION_CHECKING"
    businessEffects:
      - "Marks the beginning of SIXPAY admissibility checks."
      - "Does not query or validate a local subscription."
    eventsProduced:
      - "PaymentAuthorizationCheckingStarted"
    forbiddenTransitions:
      - "Direct RECEIVED to BANKING_CHECKING without admissibility checks."
      - "Direct RECEIVED to POSTING."
      - "Any financial effect."
    replayCapability:
      allowed: true
      mode: "IDEMPOTENT_STATE_CONFIRMATION"
      key: "PaymentId + commandId"
      duplicateResult: "Return AUTHORIZATION_CHECKING without a second event."

  - id: "PAY-TR-002"
    from: "AUTHORIZATION_CHECKING"
    trigger:
      kind: "EVENT"
      name: "PaymentAuthorizationApproved"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "Canonical request semantics are valid."
      - "Partner, channel, institution and configuration are admissible."
      - "The idempotency key and fingerprint do not conflict."
    to: "BANKING_CHECKING"
    businessEffects:
      - "Authorizes fresh customer, account, restriction and funds checks."
      - "Requests BankingVerification through the Customer port."
    eventsProduced:
      - "PaymentBankingCheckingStarted"
      - "BankingVerificationRequested"
    forbiddenTransitions:
      - "Direct AUTHORIZATION_CHECKING to APPROVED."
      - "Posting before fresh banking verification."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "authorizationDecisionEventId"
      duplicateResult: "No-op if the same favorable decision was already applied."

  - id: "PAY-TR-003"
    from: "AUTHORIZATION_CHECKING"
    trigger:
      kind: "EVENT"
      name: "PaymentAuthorizationRejected"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "A stable admissibility or semantic rejection reason exists."
      - "No financial instruction has been created."
    to: "REJECTED"
    businessEffects:
      - "Persists the rejection reason and finalization instant."
      - "Creates an immediate rejection notification intent in Outbox."
    eventsProduced:
      - "PaymentRejected"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "REJECTED to any non-terminal state."
      - "Any Amplitude posting."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "authorizationDecisionEventId"
      duplicateResult: "Return the existing rejection and notification intent."

  - id: "PAY-TR-004"
    from: "AUTHORIZATION_CHECKING"
    trigger:
      kind: "EVENT"
      name: "AuthorizationCheckFailedWithoutFinancialEffect"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "The failure is technical rather than a business rejection."
      - "Absence of any financial effect is proven."
      - "Configured safe retries are exhausted or the error is permanent."
    to: "FAILED"
    businessEffects:
      - "Persists a technical failure without banking effect."
      - "Creates a FAILED immediate notification intent."
    eventsProduced:
      - "PaymentFailed"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Classifying a business rejection as FAILED."
      - "Transitioning to FAILED when a financial effect is possible."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "failureEventId"
      duplicateResult: "No-op."

  - id: "PAY-TR-005"
    from: "BANKING_CHECKING"
    trigger:
      kind: "EVENT"
      name: "BankingVerificationSucceeded"
      owner: "SIXPAY_CUSTOMER"
    preconditions:
      - "The verification snapshot is authenticated, normalized and fresh."
      - "Customer and account exist."
      - "NIU and account ownership match."
      - "Account is operational and has no blocking restriction."
      - "Available funds are sufficient for the requested Money."
    to: "APPROVED"
    businessEffects:
      - "Stores the immutable BankingVerificationSnapshot."
      - "Records the Payment decision as approved for posting."
    eventsProduced:
      - "PaymentApproved"
    forbiddenTransitions:
      - "Approval from a stale or incomplete verification."
      - "Approval based on ObservedCustomer read data."
      - "Approval when funds availability is unknown."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "verificationId"
      duplicateResult: "No-op if snapshot and decision are identical."

  - id: "PAY-TR-006"
    from: "BANKING_CHECKING"
    trigger:
      kind: "EVENT"
      name: "BankingVerificationRejected"
      owner: "SIXPAY_CUSTOMER"
    preconditions:
      - "A fresh canonical verification contains at least one stable business rejection reason."
      - "No posting instruction exists."
    to: "REJECTED"
    businessEffects:
      - "Stores the verification evidence and normalized rejection reasons."
      - "Creates a REJECTED immediate notification intent."
    eventsProduced:
      - "PaymentRejected"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Any financial write."
      - "Reopening the rejected Payment after source-data correction."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "verificationId"
      duplicateResult: "Return existing rejection."

  - id: "PAY-TR-007"
    from: "BANKING_CHECKING"
    trigger:
      kind: "EVENT"
      name: "BankingVerificationDeferred"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "Amplitude is temporarily unavailable or the read outcome is inconclusive."
      - "No financial instruction has been submitted."
      - "The retry/recovery policy allows continued checking."
    to: "BANKING_CHECKING"
    businessEffects:
      - "Keeps the Payment recoverable without creating a false rejection."
      - "Records the deferred reason and schedules a controlled read retry."
      - "May create one PROCESSING notification intent according to contract policy."
    eventsProduced:
      - "PaymentBankingVerificationDeferred"
    forbiddenTransitions:
      - "Treating unavailability as a business rejection."
      - "Posting with an unknown banking verification."
    replayCapability:
      allowed: true
      mode: "SCHEDULED_READ_RETRY"
      key: "PaymentId + verificationCycleId + attemptNumber"
      duplicateResult: "Duplicate attempt result is ignored."

  - id: "PAY-TR-008"
    from: "BANKING_CHECKING"
    trigger:
      kind: "EVENT"
      name: "BankingVerificationFailedWithoutFinancialEffect"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "No financial instruction exists."
      - "Configured read retries are exhausted or the failure is permanent."
      - "The failure is not a stable banking rejection."
    to: "FAILED"
    businessEffects:
      - "Finalizes the Payment as a technical failure without financial effect."
      - "Creates a FAILED immediate notification intent."
    eventsProduced:
      - "PaymentFailed"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Transitioning to FAILED if posting may have reached Amplitude."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "failureEventId"
      duplicateResult: "No-op."

  - id: "PAY-TR-009"
    from: "APPROVED"
    trigger:
      kind: "COMMAND"
      name: "SubmitPaymentPosting"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "The BankingVerificationSnapshot remains fresh."
      - "No posting instruction or outcome exists."
      - "The TreasuryAccountReference comes from approved configuration."
      - "The bank idempotency key is stable and unique for this Payment."
    to: "POSTING"
    businessEffects:
      - "Creates one logical PaymentPostingInstruction."
      - "Durably records posting authorization before the network call."
    eventsProduced:
      - "PaymentPostingRequested"
    forbiddenTransitions:
      - "A second logical posting instruction."
      - "Posting with a caller-supplied TreasuryAccount."
      - "Direct APPROVED to DEBITED or CUT_CREDITED."
    replayCapability:
      allowed: true
      mode: "IDEMPOTENT_WRITE_SUBMISSION"
      key: "bankPostingIdempotencyKey"
      duplicateResult: "Reuse the existing instruction; never create another."

  - id: "PAY-TR-010"
    from: "APPROVED"
    trigger:
      kind: "EVENT"
      name: "PostingAbortedWithoutSubmission"
      owner: "SIXPAY_PAYMENT"
    preconditions:
      - "Accounting proves the posting was never submitted to Amplitude."
      - "No financial effect is possible."
      - "Recovery is exhausted or a permanent internal failure exists."
    to: "FAILED"
    businessEffects:
      - "Finalizes the Payment without financial effect."
      - "Creates a FAILED immediate notification intent."
    eventsProduced:
      - "PaymentFailed"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Using this transition after a network submission may have occurred."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "abortEventId"
      duplicateResult: "No-op."

  - id: "PAY-TR-011"
    from: "POSTING"
    trigger:
      kind: "EVENT"
      name: "CustomerDebitConfirmed"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The outcome matches the unique posting instruction."
      - "The customer debit has a stable bank reference."
      - "CUT credit is not yet confirmed."
    to: "DEBITED"
    businessEffects:
      - "Stores the confirmed debit fact."
      - "Prevents any new debit instruction."
    eventsProduced:
      - "PaymentCustomerDebited"
    forbiddenTransitions:
      - "Declaring immediate success before CUT credit."
      - "Submitting another debit."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "bankPostingReference + debitStatus"
      duplicateResult: "No-op."

  - id: "PAY-TR-012"
    from: "POSTING"
    trigger:
      kind: "EVENT"
      name: "AtomicPostingConfirmed"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "Amplitude confirms both customer debit and accounting CUT credit."
      - "The result matches the unique instruction and Money."
      - "Stable correlated bank reference or references are present."
    to: "CUT_CREDITED"
    businessEffects:
      - "Stores the complete PostingOutcomeSnapshot."
      - "Recognizes immediate posting success without establishing TFJ finality."
    eventsProduced:
      - "PaymentCustomerDebited"
      - "PaymentCutCredited"
    forbiddenTransitions:
      - "Direct POSTING to TREASURY_INTEGRATED."
      - "Treating the outcome as a TFJ confirmation."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "bankPostingReference + postingStatus"
      duplicateResult: "No-op."

  - id: "PAY-TR-013"
    from: "POSTING"
    trigger:
      kind: "EVENT"
      name: "PostingOutcomeUnknown"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The instruction may have reached Amplitude."
      - "SIXPAY cannot prove complete success or absence of effect."
    to: "ACCOUNTING_OUTCOME_UNKNOWN"
    businessEffects:
      - "Stores UNKNOWN outcome and operation context POSTING."
      - "Opens reconciliation and operational alert."
      - "Creates one PROCESSING immediate notification intent."
    eventsProduced:
      - "PaymentAccountingOutcomeUnknown"
      - "PaymentReconciliationRequested"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Blind retry of debit or CUT credit."
      - "Transition to FAILED without proof of no effect."
      - "Success notification."
    replayCapability:
      allowed: false
      mode: "RECONCILIATION_ONLY"
      key: "bankPostingIdempotencyKey or bankPostingReference"
      duplicateResult: "Repeated UNKNOWN observations are deduplicated; only lookup is allowed."

  - id: "PAY-TR-014"
    from: "POSTING"
    trigger:
      kind: "EVENT"
      name: "PostingFailedWithoutFinancialEffect"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "Amplitude or reconciliation proves no debit and no CUT credit."
      - "The failure result matches the unique instruction."
    to: "FAILED"
    businessEffects:
      - "Stores the failed PostingOutcomeSnapshot."
      - "Creates a FAILED immediate notification intent."
    eventsProduced:
      - "PaymentFailed"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Using FAILED when any financial effect is possible."
      - "Retrying with a new posting identity."
    replayCapability:
      allowed: true
      mode: "TERMINAL_FACT_REPLAY"
      key: "bankPostingReference or postingFailureEventId"
      duplicateResult: "No-op."

  - id: "PAY-TR-015"
    from: "POSTING"
    trigger:
      kind: "EVENT"
      name: "PartialPostingRequiresReversal"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "Customer debit is confirmed."
      - "CUT credit is explicitly failed."
      - "The partial outcome matches the unique instruction."
    to: "REVERSAL_REQUIRED"
    businessEffects:
      - "Stores the partial PostingOutcomeSnapshot."
      - "Opens a reconciliation and reversal case."
      - "Creates a REVERSAL_REQUIRED or PROCESSING notification intent."
    eventsProduced:
      - "PaymentReversalRequired"
      - "PaymentReconciliationRequested"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Success notification."
      - "Automatic reversal without bank instruction or approved runbook."
      - "Blind credit retry."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "bankPostingReference + partialOutcomeStatus"
      duplicateResult: "No-op."

  - id: "PAY-TR-016"
    from: "DEBITED"
    trigger:
      kind: "EVENT"
      name: "CutCreditConfirmed"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The CUT credit belongs to the same posting instruction and Money."
      - "The target is the configured TreasuryAccountReference."
      - "A stable bank reference is present."
    to: "CUT_CREDITED"
    businessEffects:
      - "Completes the PostingOutcomeSnapshot."
      - "Recognizes immediate posting success without TFJ finality."
    eventsProduced:
      - "PaymentCutCredited"
    forbiddenTransitions:
      - "Crediting a caller-supplied CUT."
      - "Direct DEBITED to TREASURY_INTEGRATED."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "bankPostingReference + cutCreditStatus"
      duplicateResult: "No-op."

  - id: "PAY-TR-017"
    from: "DEBITED"
    trigger:
      kind: "EVENT"
      name: "CutCreditOutcomeUnknown"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "Customer debit is confirmed."
      - "CUT credit success or failure cannot be proven."
    to: "ACCOUNTING_OUTCOME_UNKNOWN"
    businessEffects:
      - "Stores UNKNOWN CUT outcome and operation context POSTING."
      - "Opens reconciliation and alert."
      - "Creates one PROCESSING immediate notification intent."
    eventsProduced:
      - "PaymentAccountingOutcomeUnknown"
      - "PaymentReconciliationRequested"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Blind retry of CUT credit."
      - "Success or final notification."
    replayCapability:
      allowed: false
      mode: "RECONCILIATION_ONLY"
      key: "bankPostingIdempotencyKey or bankPostingReference"
      duplicateResult: "Only status lookup may be repeated."

  - id: "PAY-TR-018"
    from: "DEBITED"
    trigger:
      kind: "EVENT"
      name: "CutCreditFailed"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "Customer debit is confirmed."
      - "CUT credit failure is explicit and stable."
    to: "REVERSAL_REQUIRED"
    businessEffects:
      - "Stores the partial outcome and reversal reason."
      - "Creates a REVERSAL_REQUIRED or PROCESSING notification intent."
    eventsProduced:
      - "PaymentReversalRequired"
      - "PaymentImmediateNotificationRequested"
    forbiddenTransitions:
      - "Success notification."
      - "Automatic or unaudited reversal."
    replayCapability:
      allowed: true
      mode: "EVENT_DEDUPLICATION"
      key: "bankPostingReference + cutCreditFailureCode"
      duplicateResult: "No-op."

  - id: "PAY-TR-019"
    from: "ACCOUNTING_OUTCOME_UNKNOWN"
    trigger:
      kind: "EVENT"
      name: "PostingReconciledAsFullySucceeded"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The unknown operation context is POSTING."
      - "Lookup confirms both customer debit and CUT credit."
      - "The result matches the original idempotency key or posting reference."
    to: "CUT_CREDITED"
    businessEffects:
      - "Replaces UNKNOWN evidence with the reconciled complete outcome."
      - "Closes the accounting-unknown reconciliation case."
    eventsProduced:
      - "PaymentAccountingOutcomeResolved"
      - "PaymentCutCredited"
    forbiddenTransitions:
      - "Creating a second financial instruction."
      - "Direct transition to TREASURY_INTEGRATED."
    replayCapability:
      allowed: true
      mode: "RECONCILIATION_EVENT_DEDUPLICATION"
      key: "reconciliationResultEventId"
      duplicateResult: "No-op."

  - id: "PAY-TR-020"
    from: "ACCOUNTING_OUTCOME_UNKNOWN"
    trigger:
      kind: "EVENT"
      name: "PostingReconciledAsDebitOnly"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The unknown operation context is POSTING."
      - "Customer debit is confirmed."
      - "CUT credit remains pending or requires a distinct known resolution."
    to: "DEBITED"
