    from: "PENDING_END_OF_DAY_CONFIRMATION"
    trigger:
      kind: "EVENT"
      name: "MatchedSuccessfulEndOfDayConfirmation"
      owner: "SIXPAY_ACCOUNTING"
    preconditions:
      - "The confirmation is authenticated and normalized."
