semantics:
  aggregate: Payment
  initialState: RECEIVED
  terminalStates:
  - REJECTED
  - FAILED
  - TREASURY_INTEGRATED
  - REVERSED
  notificationState: null
  notificationRule: NOTIFICATION_INTENT_IS_ORTHOGONAL_AND_DELIVERY_NEVER_CHANGES_FINANCIAL_STATE
  oneLogicalPostingPerPayment: true
  financialReplayAfterUnknownAllowed: false
  tfjFinalityRule: ONLY_UNIQUELY_MATCHED_INTEGRATED_EVIDENCE_ESTABLISHES_FINALITY
  invalidTransitionBehavior: PAYMENT_DOMAIN_EXCEPTION_NO_MUTATION_NO_EVENT_NO_VERSION_INCREMENT
  sameAsSourcePseudoTarget:
    value: SAME_AS_SOURCE
    allowedTransitionIds:
    - PAY-TR-037
    meaning: The aggregate retains the concrete source state after a recoverable pre-financial failure.
  reconstitution:
    operationId: PAY-OP-017
    commandId: null
    createsTransition: false
    createsEvent: false
