states:
  RECEIVED:
    description: Authenticated canonical Payment intention is durably persisted.
    terminal: false
    financialEffectPossible: false
  AUTHORIZATION_CHECKING:
    description: SIXPAY is awaiting or applying the canonical TRESOR PAY authorization decision.
    terminal: false
    financialEffectPossible: false
  BANKING_VERIFICATION_PENDING:
    description: Authorization is approved and fresh customer/account verification is pending.
    terminal: false
    financialEffectPossible: false
  FUNDS_CONTROL_PENDING:
    description: Banking identity/account verification is approved and exact funds control is pending.
    terminal: false
    financialEffectPossible: false
  TREASURY_ACCOUNT_RESOLUTION_PENDING:
    description: Funds are approved and protected CUT/Treasury configuration resolution is pending.
    terminal: false
    financialEffectPossible: false
  APPROVED_FOR_POSTING:
    description: All required favorable evidence exists and one posting may be authorized.
    terminal: false
    financialEffectPossible: false
  POSTING_PENDING:
    description: The sole posting instruction is durable and may have reached Amplitude.
    terminal: false
    financialEffectPossible: true
  POSTING_OUTCOME_UNKNOWN:
    description: Posting result is uncertain and only authoritative lookup/reconciliation is allowed.
    terminal: false
    financialEffectPossible: true
  DEBIT_CONFIRMED:
    description: Debtor debit is confirmed while CUT credit is not confirmed complete.
    terminal: false
    financialEffectPossible: true
  POSTED_PENDING_TFJ:
    description: Debit and CUT credit are confirmed; immediate result and TFJ tracking intents exist.
    terminal: false
    financialEffectPossible: true
  REVERSAL_REQUIRED:
    description: A confirmed/reconciled effect requires explicit authorized reversal handling.
    terminal: false
    financialEffectPossible: true
  REVERSAL_PENDING:
    description: An authorized reversal instruction is durable and awaiting a known result.
    terminal: false
    financialEffectPossible: true
  REVERSAL_OUTCOME_UNKNOWN:
    description: Reversal result is uncertain and only authoritative lookup is allowed.
    terminal: false
    financialEffectPossible: true
  REJECTED:
    description: Conclusive business/security rejection with no financial effect.
    terminal: true
    financialEffectPossible: false
  FAILED:
    description: Technical processing ended with proven absence of financial effect.
    terminal: true
    financialEffectPossible: false
  TREASURY_INTEGRATED:
    description: Uniquely matched Amplitude TFJ INTEGRATED evidence establishes finality.
    terminal: true
    financialEffectPossible: true
  REVERSED:
    description: Authorized bank reversal is confirmed; original posting evidence remains.
    terminal: true
    financialEffectPossible: true
