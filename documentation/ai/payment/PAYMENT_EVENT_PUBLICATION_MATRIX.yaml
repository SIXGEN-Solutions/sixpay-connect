schemaVersion: 1.0.0
document:
  id: SIXPAY-PAYMENT-EVENT-PUBLICATION-MATRIX
  lot: 6_EVENTS_AUDIT_OUTBOX
  status: NORMATIVE_IMPLEMENTED
  codeGenerationAllowed: false
defaults:
  auditRequired: true
  deduplicationKey: eventId
  ordering:
  - aggregateVersion
  - eventSequence
  publisherFailureEffectOnPayment: NONE
  directKafkaFromAggregateAllowed: false
events:
- id: PAY-EVT-001
  domainEvent: PaymentReceived
  role: LIFECYCLE_FACT
  domainSchemaVersion: 1
  auditRequired: true
  outboxRequired: true
  integrationMappingRequired: true
  integrationSchemaVersion: 1
  consumers:
  - module: customer
    purpose: Create or update the initial ObservedCustomer projection from minimized Payment facts.
    idempotency: eventId
  - module: reporting
    purpose: Update Payment search and immutable timeline projections.
    idempotency: eventId
  safePayloadFields:
  - name: externalPaymentReference
    type: ExternalPaymentReference
    classification: BUSINESS_REFERENCE
    required: true
  - name: source
    type: PaymentSource
    classification: INTERNAL_NON_SENSITIVE
    required: true
  - name: financialInstitutionCode
    type: FinancialInstitutionCode
    classification: INTERNAL_NON_SENSITIVE
    required: true
  - name: requestedAmount
    type: MoneyPayload
    classification: RESTRICTED_FINANCIAL
    required: true
  - name: maskedDebtorAccountReference
    type: string
    classification: RESTRICTED_DISPLAY
    required: true
  - name: receivedAt
    type: Instant
    classification: INTERNAL_NON_SENSITIVE
    required: true
  forbiddenData:
  - ExternalSubscriptionReference unless an approved consumer contract requires it.
  - Clear debtor account.
  - Inbound headers or raw request.
  - Authorization token or Subscription Key.
  replayPolicy:
    publication: SAME_EVENT_ID_SCHEMA_VERSION_AND_PAYLOAD
    consumerDeduplication: eventId
    projectionReplayAllowed: true
    externalSideEffectReplay: FORBIDDEN_PROJECTION_REPLAY_ONLY
- id: PAY-EVT-002
  domainEvent: PaymentAuthorizationCheckingStarted
  role: PROCESS_REQUEST
  domainSchemaVersion: 1
  auditRequired: true
  outboxRequired: true
  integrationMappingRequired: true
  integrationSchemaVersion: 1
  consumers:
  - module: security
    purpose: Resolve and validate canonical TRESOR PAY authorization evidence.
    idempotency: eventId
  - module: integration
    purpose: Coordinate local token/JWKS validation without exposing credentials to Payment.
    idempotency: eventId
  - module: reporting
    purpose: Update Payment search and immutable timeline projections.
    idempotency: eventId
  safePayloadFields:
  - name: startedAt
    type: Instant
    classification: INTERNAL_NON_SENSITIVE
    required: true
  forbiddenData: []
  replayPolicy:
    publication: SAME_EVENT_ID_SCHEMA_VERSION_AND_PAYLOAD
    consumerDeduplication: eventId
    projectionReplayAllowed: true
    externalSideEffectReplay: REVALIDATION_ALLOWED_BY_EVENT_ID_NO_FINANCIAL_EFFECT
- id: PAY-EVT-003
  domainEvent: PaymentAuthorizationDecisionRecorded
  role: EVIDENCE_FACT
  domainSchemaVersion: 1
  auditRequired: true
  outboxRequired: false
  integrationMappingRequired: false
  integrationSchemaVersion: null
  consumers:
  - module: reporting
    purpose: Update Payment search and immutable timeline projections.
    idempotency: eventId
  safePayloadFields:
  - name: outcome
    type: APPROVED|REJECTED
    classification: INTERNAL_NON_SENSITIVE
    required: true
  - name: authorizationEvidenceReference
    type: AuthorizationEvidenceReference
    classification: RESTRICTED_SECURITY_EVIDENCE
    required: true
  - name: evidenceFingerprint
    type: EvidenceFingerprint
    classification: INTERNAL_SECURITY_METADATA
    required: true
  - name: rejectionCode
    type: FailureCode
    classification: INTERNAL_NON_SENSITIVE
    required: false
  - name: acceptedAt
    type: Instant
    classification: INTERNAL_NON_SENSITIVE
    required: true
  forbiddenData:
  - Raw JWT.
  - Raw jti.
  - Raw claims.
  - Signature bytes.
  - JWKS document.
  replayPolicy:
    publication: SAME_EVENT_ID_SCHEMA_VERSION_AND_PAYLOAD
    consumerDeduplication: eventId
    projectionReplayAllowed: true
    externalSideEffectReplay: FORBIDDEN_PROJECTION_REPLAY_ONLY
