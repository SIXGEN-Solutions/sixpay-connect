schemaVersion: 1.0.0
document:
  id: SIXPAY-PAYMENT-POLICY-DOMAIN-SERVICE-CATALOGUE
  title: SIXPAY CONNECT — Payment Policies and Domain Services
  gate: IA-1_PAYMENT_DOMAIN_BRIEF
  lot: 2_7_POLICIES_AND_DOMAIN_SERVICES
  branch: feat/payment-domain-generation-brief
  status: DRAFT_PENDING_VALIDATION
  normative: true
  codeGenerationAllowed: false
  nextLot: 2_8_FINAL_MODEL_VALIDATION
designRules:
  aggregateOwnsStateTransitions: true
  aggregateOwnsDomainEventRegistration: true
  domainServicesMutateAggregate: false
  domainServicesRegisterEvents: false
  domainPoliciesPerformIo: false
  domainReadsClockDirectly: false
  configurationLoadedInsideDomain: false
  springOrPersistenceDependencyAllowed: false
  exceptions: Policy/service invalid input may raise a stable domain exception; normal business decisions are returned as typed results.
decisionTypes:
  EvidenceTemporalDecision:
  - VALID
  - STALE
  - FUTURE_DATED
  - INVALID_CHRONOLOGY
  EvidenceAcceptanceDecision:
  - ACCEPT
  - REJECT
  - INDETERMINATE
  - CONFLICT
  EvidenceReplayDecision:
  - ACCEPT_NEW
  - NO_OP_IDENTICAL
  - REPLACE_MORE_AUTHORITATIVE
  - REJECT_CONFLICT
  - QUARANTINE_CONFLICT
  - REJECT_TERMINAL_REPLACEMENT
  PostingAuthorizationDecision:
  - AUTHORIZE
  - NO_OP_SAME_INSTRUCTION
  - REJECT_INELIGIBLE
  - REJECT_SECOND_OR_CONFLICTING_INSTRUCTION
  PostingDecision:
  - POSTED_PENDING_TFJ
  - DEBIT_CONFIRMED
  - POSTING_OUTCOME_UNKNOWN
  - REJECTED_NO_EFFECT
  - FAILED_NO_EFFECT
  - REVERSAL_REQUIRED
  - NO_OP
  - CONFLICT
  EndOfDayDecision:
  - TREASURY_INTEGRATED
  - REVERSAL_REQUIRED
  - MANUAL_RECONCILIATION
  - NO_OP
  - QUARANTINE_CONFLICT
  ReversalDecision:
  - AUTHORIZE
  - REVERSED
  - REVERSAL_OUTCOME_UNKNOWN
  - REVERSAL_REQUIRED
  - NO_OP
  - CONFLICT
  FailureDispositionDecision:
  - BUSINESS_REJECT
  - SECURITY_REJECT
  - TECHNICAL_FAIL_NO_EFFECT
  - DEFER
  - OUTCOME_UNKNOWN
  - REVERSAL_REQUIRED
  ResultIntentDecision:
  - NONE
  - IMMEDIATE_PROCESSING
  - IMMEDIATE_REJECTED
  - IMMEDIATE_FAILED
  - IMMEDIATE_POSTED_PENDING_TFJ
  - IMMEDIATE_REVERSAL_REQUIRED
  - FINAL_TREASURY_INTEGRATED
  - REVERSAL_REVERSED
  - REVERSAL_REJECTED_OR_NOT_ALLOWED
  EventDisclosureDecision:
  - ALLOW
  - REJECT_UNDECLARED_FIELD
  - REJECT_CLASSIFICATION
  - REJECT_SENSITIVE_DATA
configurationProfileContract:
  requiredMetadata:
  - profileId
  - profileVersion
  - effectiveFrom
  - effectiveUntil?
  - approvedByReference
  loadingOwner: APPLICATION_VIA_PAYMENT_POLICY_CONFIGURATION_PORT
  decisionUse: Handler selects an effective immutable profile and passes it explicitly.
  auditRule: Profile identity/version is recorded in audit or accepted evidence when it materially influences the decision.
  secretAllowed: false
  hardCodedBankSpecificValuesAllowed: false
profiles:
- name: EvidenceTemporalProfile
  purpose: Approved clock-skew and freshness rules by evidence category.
  forbiddenValues: No implicit or hard-coded duration.
- name: AuthorizationPolicyProfile
  purpose: Allowed issuer, scope, algorithms, mandatory binding types and validity semantics.
  forbiddenValues: No signing key, JWKS body, token or credential.
- name: BankingVerificationPolicyProfile
  purpose: Mandatory banking checks and freshness classification.
  forbiddenValues: No customer/KYC values.
- name: FundsControlPolicyProfile
  purpose: Mandatory funds checks and use of authoritative validUntil.
  forbiddenValues: No balance threshold invented outside exact Payment amount.
- name: TreasuryResolutionPolicyProfile
  purpose: Approved protected configuration type, version semantics and bank compatibility.
  forbiddenValues: No Treasury account token or clear account.
- name: PostingAuthorizationPolicyProfile
  purpose: Requirements for the sole posting instruction and evidence coherence.
  forbiddenValues: No retry or timeout configuration.
- name: FinancialOutcomePolicyProfile
  purpose: Approved structural combinations and authoritative-result ranking.
  forbiddenValues: No HTTP/status-code retry table.
- name: TfjPolicyProfile
  purpose: Accepted final statuses, unique-match proof rules and recovery-action semantics.
  forbiddenValues: No persistence query or scheduler configuration.
- name: ReversalPolicyProfile
  purpose: Approved authorization types, reason categories and one-active-instruction rules.
  forbiddenValues: No operator permissions or credentials.
- name: FailureClassificationProfile
  purpose: Stable mappings from category/stage/retry disposition and effect knowledge.
  forbiddenValues: No free-form message parsing.
- name: ResultIntentPolicyProfile
  purpose: Mapping from accepted transitions to IMMEDIATE, FINAL or REVERSAL result types.
  forbiddenValues: No delivery endpoint, retry or webhook credential.
- name: EventDisclosureProfile
  purpose: Event field allowlists, classifications and denylist.
  forbiddenValues: No decryption capability or secret.
policies:
- id: PAY-POL-001
  name: EvidenceTemporalValidityPolicy
  kind: DOMAIN_POLICY
  purpose: Validate structural chronology, future-dating tolerance, freshness and explicit validity windows for canonical evidence.
  conceptualPackage: com.sixpay.payment.domain.policy
  inputs:
  - EvidenceMetadata
  - Instant decisionAt
  - EvidenceTemporalProfile
  configurationProfile: EvidenceTemporalProfile
  output: EvidenceTemporalDecision
  invariantRefs:
  - PAY-INV-009
  - PAY-INV-022
  - PAY-INV-032
  commandRefs:
  - PAY-CMD-003
  - PAY-CMD-004
  - PAY-CMD-005
  - PAY-CMD-006
  - PAY-CMD-010
  purity:
    deterministicForSameInputs: true
    ioAllowed: false
    repositoryAccessAllowed: false
    networkAccessAllowed: false
    frameworkDependencyAllowed: false
    secretAccessAllowed: false
    currentTimeReadAllowed: false
    timeMustBeExplicitInput: true
  forbidden:
  - Read a system clock.
  - Invent a freshness duration.
  - Convert a stale result into approval.
  verification:
  - PURE_UNIT_TEST
  - PROPERTY_BASED_WHERE_APPLICABLE
  - DECISION_TABLE_TEST
