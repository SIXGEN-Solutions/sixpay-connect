identifierValueObjects:
  PaymentId:
    format: UUID_V4_NON_NIL
    generatedBy: APPLICATION_PORT
    opaque: true
  PaymentSource:
    values:
    - TRESOR_PAY
    extensibleOnlyByDecision: true
  ExternalPaymentReference:
    sourceField: tresorPayPaymentReference/endToEndId
    length:
      min: 1
      max: 128
    caseSensitive: true
    uniquenessScope:
    - PAYMENT_SOURCE
    - REFERENCE
    immutable: true
    recyclable: false
  ExternalSubscriptionReference:
    requiredForMvp: true
    localAggregateReference: false
    immutable: true
  PublicPaymentReference:
    format: PAY-<ULID_UPPERCASE>
    generatedBy: APPLICATION_PORT
  IdempotencyKey:
    length:
      min: 8
      max: 128
    caseSensitive: true
  RequestFingerprint:
    algorithm: SHA-256
    encoding: LOWERCASE_HEX
    length: 64
  CorrelationId:
    format: UUID_NON_NIL
  PaymentRequestIdentity:
    components:
    - IdempotencyKey
    - RequestFingerprint
    - CorrelationId
  FinancialInstitutionCode:
    length:
      min: 2
      max: 32
    normalization: UPPERCASE
accountValueObjects:
  DebtorAccountReference:
    components:
    - FinancialInstitutionCode
    - IntegrationAccountToken
    - MaskedDisplay
    - BindingFingerprint
    clearAccountStored: false
    eventExposure: FINGERPRINT_OR_MASKED_ONLY_WHEN_JUSTIFIED
  TreasuryAccountReference:
    createdBy: PROTECTED_TREASURY_CONFIGURATION_RESOLVER
    inboundValueMayOverride: false
    bankCoherenceRequired: true
treasuryAllocation:
  collectionType: TreasuryAllocationIntent
  minItems: 1
  maxItems: 20
  beneficiaryUnique: true
  allAmountsPositive: true
  sameCurrencyAsPayment: true
  sumEqualsPaymentAmount: true
money:
  type: com.sixpay.sharedkernel.domain.valueobject.Money
  duplicateAllowed: false
  sourceModificationRequired: false
  paymentRequiresPositive: true
  bankCurrencyCompatibilityPolicyRequired: true
bankPostingReference:
  principalRequiredAfterConfirmedPosting: true
  debitLegOptional: true
  cutCreditLegOptional: true
  preservedAfterReversal: true
  commandIdentityDistinct: true
paymentFailure:
  storage: CURRENT_RELEVANT_ONLY
  historyOwner: AUDIT_AND_REPORTING
  fields:
  - failureCode
  - failureCategory
  - failureStage
  - retryDisposition
  - safeMessage
  - occurredAt
  - externalSystem
  categories:
  - BUSINESS_REJECTION
  - TECHNICAL_FAILURE
  - UNCERTAIN_EXTERNAL_OUTCOME
  - SECURITY_REJECTION
  - INTEGRATION_CONFLICT
  - TREASURY_RECONCILIATION_FAILURE
