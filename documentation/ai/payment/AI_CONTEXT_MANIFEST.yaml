evidenceMetadata:
  type: EvidenceMetadata
  requiredFields:
  - sourceSystem
  - correlationId
  - observationChannel
  - evidenceFingerprint
  - observedAt
  - acceptedAt
  fingerprintFormat: v1:sha256:<64_lowercase_hex>
  acceptedAtNotBeforeObservedAt: true
snapshotStorage:
  currentAcceptedPerCategory: 1
  fullHistoryOwner: APPEND_ONLY_AUDIT_AND_REPORTING
  rawExternalPayloadAllowed: false
  automaticEventSerializationAllowed: false
snapshots:
  AuthorizationEvidenceSnapshot:
    source: TRESOR_PAY
    outcomes:
    - APPROVED
    - REJECTED
    rawJwtStored: false
    rawClaimsStored: false
    bindingEvidenceStored: true
  BankingVerificationSnapshot:
    source: AMPLITUDE
    outcomes:
    - VERIFIED
    - REJECTED
    - INDETERMINATE
    customerKycValuesStored: false
    canonicalChecksStored: true
  FundsControlSnapshot:
    source: AMPLITUDE
    outcomes:
    - VERIFIED
    - REJECTED
    - INDETERMINATE
    bindsExactPaymentAmount: true
    availableBalanceStored: false
    validUntilRequired: true
  TreasuryAccountResolutionSnapshot:
    source: SIXPAY
    channels:
    - PROTECTED_CONFIGURATION_RESOLUTION
    outcomes:
    - RESOLVED
    - REJECTED
    inboundAccountMayOverride: false
  PostingOutcomeSnapshot:
    source: AMPLITUDE
    outcomes:
    - COMPLETED
    - REJECTED_NO_FINANCIAL_EFFECT
    - DEBIT_CONFIRMED_CUT_CREDIT_PENDING
    - REVERSAL_REQUIRED
    - UNKNOWN
    debitLegRequired: true
    cutCreditLegRequired: true
    unknownMeansFailure: false
    blindReplayAllowed: false
  EndOfDayConfirmationSnapshot:
    source: AMPLITUDE
    acceptedStatuses:
    - INTEGRATED
    - FAILED
    pendingAcceptedIntoAggregate: false
    uniqueMatchingRequired: true
    matchingKeys:
    - financialInstitutionCode
    - businessDate
    - publicPaymentReference
    - principalBankPostingReference
  ReversalSnapshot:
    originalPaymentPreserved: true
    originalPostingReferencePreserved: true
    authorizationRequiredBeforeSubmission: true
    outcomes:
    - REVERSED
    - REJECTED
    - NOT_ALLOWED
    - UNKNOWN
snapshotReplayPolicy:
  sameIdentitySameFingerprint: NO_OP
  sameIdentityDifferentFingerprint: CONFLICT_NO_PAYMENT_MUTATION
  financialOrTfjConflict: QUARANTINE_AUDIT_ALERT
  terminalEvidenceReplaceable: false
