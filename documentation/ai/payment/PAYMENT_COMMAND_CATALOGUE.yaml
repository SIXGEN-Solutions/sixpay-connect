schemaVersion: 1.2.0
document:
  id: SIXPAY-PAYMENT-COMMAND-CATALOGUE
  title: SIXPAY CONNECT — Payment Commands and Aggregate Operations
  gate: IA-1_PAYMENT_DOMAIN_BRIEF
  lot: 2_7_POLICIES_AND_DOMAIN_SERVICES
  branch: feat/payment-domain-generation-brief
  status: POLICY_AND_SERVICE_BINDINGS_ADDED
  normative: true
  codeGenerationAllowed: false
  nextLot: 2_8_FINAL_MODEL_VALIDATION
commandMetadata:
  requiredFields:
  - commandId
  - operationCorrelationId
  - requestedAt
  optionalFields:
  - paymentId
  - expectedBusinessVersion
  - causationReference
  - sourceEventId
  - actorReference
  commandIdFormat: NON_NIL_UUID
  deduplication:
    sameCommandIdSameFingerprint: RETURN_RECORDED_RESULT
    sameCommandIdDifferentFingerprint: COMMAND_CONFLICT
    owner: APPLICATION_COMMAND_REGISTRY
  versionModes:
    NONE: Creation command; no existing aggregate version exists.
    REQUIRED: Expected version must equal the loaded Payment businessVersion.
    STATE_AND_EVIDENCE_GUARDED: Expected version may be omitted for asynchronous canonical results; the current aggregate state, evidence identity and persistence
      optimistic lock remain mandatory.
aggregateOperationModel:
  commandObjectsEnterAggregate: false
  genericStatusSetterAllowed: false
  genericApplyCommandMethodAllowed: false
  invalidOperationBehavior: PAYMENT_DOMAIN_EXCEPTION_NO_MUTATION
  successfulMutationRegistersDomainFacts: true
  domainMethodsReturn: VOID_EXCEPT_STATIC_FACTORIES
  reconstitutionCommandExists: false
commands:
