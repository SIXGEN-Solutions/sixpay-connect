crossContractRules:
  - id: "PAY-XCON-001"
    rule: "PaymentReference, TresorPayRequestId and CorrelationId keep the same semantics in every applicable contract."
  - id: "PAY-XCON-002"
    rule: "External DTOs never become domain objects; Integration maps them to canonical commands and results."
  - id: "PAY-XCON-003"
    rule: "The immediate notification never exposes TREASURY_INTEGRATED before a matched successful TFJ result."
  - id: "PAY-XCON-004"
    rule: "Unknown or partial posting outcomes cannot be translated into a final success or failure."
  - id: "PAY-XCON-005"
    rule: "Every webhook replay reuses its business eventId while each delivery attempt has a distinct deliveryId."
  - id: "PAY-XCON-006"
    rule: "No contract accepts Subscription lifecycle decisions or merchant management in the MVP."
  - id: "PAY-XCON-007"
    rule: "No query or audit API provides a Payment mutation operation."
  - id: "PAY-XCON-008"
    rule: "Contract examples, errors and logs contain masked or synthetic bank data only."
  - id: "PAY-XCON-009"
    rule: "Payment timeline, immutable audit evidence and controlled audit exports are exposed only by payment-audit-query-api-v1."
  - id: "PAY-XCON-010"
    rule: "Every privileged audit consultation, denial and export is itself audited."

gateIA05PProductionOrder:
  - order: 1
    artifacts:
      - "tresorpay-payment-request-api-v1"
    reason: "Closes the inbound identity, persistence acknowledgement and idempotency boundary."
  - order: 2
    artifacts:
      - "amplitude-payment-verification-api-v1"
      - "amplitude-payment-posting-api-v1"
    reason: "Closes the bank read, financial write and recovery boundaries."
  - order: 3
    artifacts:
      - "tresorpay-payment-status-webhook-v1"
    reason: "Closes immediate external outcomes after the state and posting contracts."
  - order: 4
    artifacts:
      - "amplitude-end-of-day-confirmation-api-v1"
    reason: "Closes primary and fallback Treasury finality."
  - order: 5
    artifacts:
      - "tresorpay-treasury-integration-webhook-v1"
    reason: "Depends on the finality contract."
  - order: 6
    artifacts:
      - "payment-query-api-v1"
      - "observed-customer-query-api-v1"
      - "payment-audit-query-api-v1"
    reason: "Projects approved state, notification and TFJ semantics while isolating privileged audit access."

