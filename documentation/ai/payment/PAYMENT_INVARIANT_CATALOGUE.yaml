  sourceRefs:
  - PAY-AGG-001
  - PAY-DEC-IA1-007
  verification:
  - DOMAIN_UNIT
  policyRefs: []
  domainServiceRefs: []
  applicationStrategy:
    checkMoment: CREATION_RECONSTITUTION_AND_EVERY_SUCCESSFUL_MUTATION
    proofProvider: Payment Aggregate / immutable Value Objects / accepted snapshots
    aggregateMethods:
    - Payment.receive
    - Payment.reconstitute
    - PaymentState validation
    stableErrorCode: PAYMENT_INVARIANT_VIOLATION
    testRefs:
    - DOMAIN_UNIT
    - PaymentCreationAndReconstitutionTest
    auditImpact: On success, append transition audit with PaymentId, source/target state, resulting version and safe evidence references; on rejection, no transition
      audit.
    persistenceOrIntegrationConstraint: Aucune contrainte DB spécifique; contrôle domaine/application/intégration.
    responsibilitySplit:
      aggregate: true
      application: false
      persistence: false
      idempotencyStore: false
      bankIntegration: false
      accounting: false
