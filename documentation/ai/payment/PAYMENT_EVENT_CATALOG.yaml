rules:
- id: PAY-EVT-RULE-001
  rule: Every Payment event is an immutable past-tense fact registered only after a successful aggregate mutation.
- id: PAY-EVT-RULE-002
  rule: Every event type maps to exactly one canonical domain fact kind.
- id: PAY-EVT-RULE-003
  rule: No-op replay, stale command, conflict, invalid transition and reconstitution create no event.
- id: PAY-EVT-RULE-004
  rule: All events from one mutation share the resulting aggregateVersion and use eventSequence for deterministic local order.
- id: PAY-EVT-RULE-005
  rule: Event publication and redelivery preserve eventId, type, schema version and payload.
- id: PAY-EVT-RULE-006
  rule: Payment mutation, immutable audit and Outbox event records commit atomically.
- id: PAY-EVT-RULE-007
  rule: Domain event payloads are explicit safe views and never automatic serialization of aggregates, snapshots or protected Value Objects.
- id: PAY-EVT-RULE-008
  rule: Only RESULT_INTENT events trigger Notification delivery; delivery events remain owned by Notification and never mutate Payment.
- id: PAY-EVT-RULE-009
  rule: PROCESS_REQUEST replay uses the event-specific business idempotency identity and never relies on broker delivery semantics alone.
- id: PAY-EVT-RULE-010
  rule: Projection replay never invokes Amplitude, TRESOR PAY or another financial/notification side effect.
- id: PAY-EVT-RULE-011
  rule: EventType is stable; schemaVersion changes for required-field, removal, rename or semantic changes.
- id: PAY-EVT-RULE-012
  rule: A retired event name is never reused for a different business fact.
