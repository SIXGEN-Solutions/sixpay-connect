stateMachineAliases:
  PaymentRequestRejected:
    replaces:
      - "PaymentRejected"
  BankingVerificationStarted:
    replaces:
      - "PaymentBankingCheckingStarted"
      - "BankingVerificationRequested"
  BankingVerificationCompleted:
    consolidates:
      - "BankingVerificationSucceeded"
      - "BankingVerificationRejected"
  PaymentPostingStarted:
    replaces:
      - "PaymentPostingRequested"
  PaymentDebited:
    replaces:
      - "PaymentCustomerDebited"
  TreasuryAccountCredited:
    replaces:
      - "PaymentCutCredited"
  PaymentPostingOutcomeUnknown:
    replaces:
      - "PaymentAccountingOutcomeUnknown"
  PaymentImmediateResultAvailable:
    consolidates:
      - "PaymentImmediateNotificationRequested"
      - "PaymentImmediateNotificationIntentRegistered"
  PaymentPendingEndOfDayConfirmation:
    replaces:
      - "PaymentEndOfDayConfirmationPending"
  TreasuryIntegrationConfirmed:
    preserves:
      - "TreasuryIntegrationConfirmed"
  PaymentReversalRequired:
    preserves:
      - "PaymentReversalRequired"
  PaymentReversed:
    preserves:
      - "PaymentReversed"
  PaymentFailed:
    preserves:
      - "PaymentFailed"

projectionSourceMapping:
  ObservedCustomer:
    consumer: "customer"
    events:
      - "PaymentRequestReceived"
      - "BankingVerificationCompleted"
      - "PaymentRequestRejected"
      - "PaymentApproved"
      - "TreasuryAccountCredited"
      - "TreasuryIntegrationConfirmed"
      - "PaymentFailed"
      - "PaymentReversed"
  PaymentTimeline:
    consumer: "reporting"
    events:
      - "*"
  NotificationDelivery:
    consumer: "notification"
    events:
      - "PaymentRequestRejected"
      - "PaymentPostingOutcomeUnknown"
      - "PaymentImmediateResultAvailable"
      - "TreasuryIntegrationConfirmed"
      - "PaymentReversalRequired"
      - "PaymentReversed"
      - "PaymentFailed"

catalogRules:
  - id: "PAY-EVT-RULE-001"
    rule: "Every event is immutable and past tense."
  - id: "PAY-EVT-RULE-002"
    rule: "Every event has one producer, explicit consumers and PaymentId as aggregate key."
  - id: "PAY-EVT-RULE-003"
    rule: "Every event uses eventId deduplication and preserves eventId across delivery attempts."
  - id: "PAY-EVT-RULE-004"
    rule: "Every lifecycle event propagates Payment.correlationId."
  - id: "PAY-EVT-RULE-005"
    rule: "Every payload is minimized and inherits EVT-SENSITIVE-001."
  - id: "PAY-EVT-RULE-006"
    rule: "Payment state and events commit atomically through Transactional Outbox."
  - id: "PAY-EVT-RULE-007"
    rule: "Projection replay never invokes an external financial or notification side effect."
  - id: "PAY-EVT-RULE-008"
    rule: "A replay of PaymentPostingStarted never creates a second logical posting."
  - id: "PAY-EVT-RULE-009"
    rule: "A replay of PaymentPostingOutcomeUnknown permits lookup only, never blind financial replay."
  - id: "PAY-EVT-RULE-010"
    rule: "PaymentNotificationDelivered is informational and cannot transition Payment."
  - id: "PAY-EVT-RULE-011"
    rule: "TreasuryIntegrationConfirmed requires a matched successful TFJ result already persisted."
  - id: "PAY-EVT-RULE-012"
    rule: "PaymentReversalRequired never commands an automatic reversal."

coverage:
  requestedEvents:
    - "PaymentRequestReceived"
    - "PaymentRequestRejected"
    - "BankingVerificationStarted"
    - "BankingVerificationCompleted"
    - "PaymentApproved"
    - "PaymentPostingStarted"
