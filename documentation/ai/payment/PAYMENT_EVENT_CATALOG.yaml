schemaVersion: 2.0.0
document:
  id: SIXPAY-PAYMENT-DOMAIN-EVENT-CATALOGUE
  title: SIXPAY CONNECT — IA-1 Payment Domain Event Catalogue
  gate: IA-1_PAYMENT_DOMAIN_BRIEF
  lot: 2_6_DOMAIN_EVENTS
  branch: feat/payment-domain-generation-brief
  status: DRAFT_PENDING_VALIDATION
  normative: true
  codeGenerationAllowed: false
  nextLot: 2_7_POLICIES_AND_DOMAIN_SERVICES
  replacesSemanticsOf: IA-0P_PAYMENT_EVENT_CATALOG_V1
scope:
  paymentAggregateEventCount: 33
  idRange:
    from: PAY-EVT-001
    through: PAY-EVT-033
  includes: ONLY_EVENTS_REGISTERED_BY_PAYMENT_AGGREGATE
  excludes:
  - NOTIFICATION_DELIVERY_PROCESS_EVENTS
  - ACCOUNTING_PROCESS_EVENTS
  - CUSTOMER_PROCESS_EVENTS
  - RAW_EXTERNAL_CALLBACKS
  - COMMAND_OBJECTS
domainContract:
  conceptualInterface: PaymentDomainEvent extends DomainEvent
  sharedKernelReference: com.sixpay.sharedkernel.domain.event.DomainEvent
  requiredFields:
  - name: eventId
    type: UUID
    source: GENERATED_ONCE
  - name: paymentId
    type: PaymentId
  - name: paymentReference
    type: PublicPaymentReference
  - name: correlationId
    type: CorrelationId
  - name: aggregateVersion
    type: positive long
  - name: eventSequence
    type: positive int
  - name: causationId
    type: UUID?
    required: false
  - name: occurredAt
    type: Instant
  eventTypeRule: EXACT_JAVA_RECORD_SIMPLE_NAME
  eventIdFormat: UUID_V4_NON_NIL
  occurredAtSource: CONTROLLED_INSTANT_SUPPLIED_TO_AGGREGATE_OPERATION
  multipleEventsPerMutation:
    aggregateVersion: SAME_RESULTING_VERSION
    eventSequence: ONE_BASED_ORDER_WITHIN_MUTATION
integrationEnvelopeMapping:
  implementationReference: com.sixpay.common.messaging.model.IntegrationEventEnvelope
  aggregateType: PAYMENT
  mapping:
    eventId: domainEvent.eventId
    eventType: domainEvent.eventType
    schemaVersion: catalogue event schemaVersion
    aggregateId: domainEvent.paymentId.value
    correlationId: domainEvent.correlationId.value
    occurredAt: domainEvent.occurredAt
    payload: explicit JSON safe payload including common payload fields
  commonPayloadFields:
  - name: paymentReference
    type: PublicPaymentReference
    required: true
  - name: paymentStatus
    type: PaymentStatus
    required: true
  - name: aggregateVersion
    type: positive long
    required: true
  - name: eventSequence
    type: positive int
    required: true
  - name: causationId
    type: UUID
    required: false
  wholeDomainObjectSerializationAllowed: false
publicationPolicy:
  mechanism: TRANSACTIONAL_OUTBOX
  guarantee: AT_LEAST_ONCE
  aggregateTransaction:
  - PAYMENT_STATE
  - IMMUTABLE_AUDIT
  - OUTBOX_EVENTS
  partitionKey: aggregateId
  ordering:
  - aggregateVersion
  - eventSequence
  noOpOrRejectedOperationCreatesEvent: false
  reconstitutionCreatesEvent: false
  republish: PRESERVE_EVENT_ID_EVENT_TYPE_SCHEMA_VERSION_AND_PAYLOAD
  sameEventIdDifferentPayload: QUARANTINE_AND_ALERT
consumerPolicy:
  deduplicationKey: eventId
  consumerMutationAndProcessedMarkerAtomic: true
  unsupportedSchemaVersion: VERSION_QUARANTINE_AND_ALERT
  projectionReplay: ALLOWED_WITHOUT_EXTERNAL_SIDE_EFFECT
  processRequestReplay: EVENT_SPECIFIC_BUSINESS_IDEMPOTENCY_REQUIRED
  notificationReplay: SOURCE_EVENT_ID_PLUS_NOTIFICATION_PHASE
payloadComponents:
  MoneyPayload:
    fields:
    - name: amount
      type: decimal string
    - name: currency
      type: ISO-4217 string
  SafeCheckResult:
    fields:
    - name: type
      type: stable check code
    - name: result
      type: PASS|FAIL|UNKNOWN
    - name: reasonCode
      type: FailureCode
      required: false
  PostingLegPayload:
    fields:
    - name: status
      type: PostingLegStatus
    - name: reference
      type: string
      required: false
    - name: effectiveAt
      type: Instant
      required: false
    - name: failureCode
      type: FailureCode
      required: false
sensitiveDataDenylist:
- AUTHORIZATION_TOKEN
- SUBSCRIPTION_KEY
- API_KEY_PASSWORD_SECRET_OR_PRIVATE_KEY
- RAW_JWT_CLAIMS_SIGNATURE_OR_JWKS
- CLEAR_DEBTOR_OR_TREASURY_ACCOUNT
- GENERAL_EVENT_ACCOUNT_INTEGRATION_TOKEN
- FULL_NIU_OR_CUSTOMER_IDENTITY
- RAW_KYC_DATA
- AVAILABLE_OR_LEDGER_BALANCE
- RAW_TRESOR_PAY_OR_AMPLITUDE_PAYLOAD
- STACK_TRACE_SQL_ENDPOINT_OR_INFRASTRUCTURE_TOPOLOGY
- FREE_FORM_PROVIDER_ERROR
- OPERATOR_CREDENTIAL_OR_BANK_INSTRUCTION_DOCUMENT
events:
- id: PAY-EVT-001
  name: PaymentReceived
  factKind: PAYMENT_RECEIVED
  classification: PAYMENT_DOMAIN_EVENT
  role: LIFECYCLE_FACT
  schemaVersion: 1
  description: A canonical authenticated Payment intention has been durably created.
  payloadFields:
  - name: externalPaymentReference
    type: ExternalPaymentReference
    required: true
    classification: BUSINESS_REFERENCE
  - name: source
    type: PaymentSource
    required: true
    classification: INTERNAL_NON_SENSITIVE
  - name: financialInstitutionCode
    type: FinancialInstitutionCode
    required: true
    classification: INTERNAL_NON_SENSITIVE
  - &id002
    name: requestedAmount
    type: MoneyPayload
    required: true
    classification: RESTRICTED_FINANCIAL
    description: Decimal string amount and ISO-4217 currency.
  - name: maskedDebtorAccountReference
    type: string
    required: true
    classification: RESTRICTED_DISPLAY
  - name: receivedAt
    type: Instant
    required: true
    classification: INTERNAL_NON_SENSITIVE
  consumers:
  - module: customer
    purpose: Create or update the initial ObservedCustomer projection from minimized Payment facts.
    sideEffect: PROJECTION_ONLY
    idempotency: eventId
  - &id001
    module: reporting
    purpose: Update Payment search and immutable timeline projections.
    sideEffect: PROJECTION_ONLY
    idempotency: eventId
  sensitiveDataForbidden:
  - ExternalSubscriptionReference unless an approved consumer contract requires it.
  - Clear debtor account.
  - Inbound headers or raw request.
  - Authorization token or Subscription Key.
  replayPolicy:
    publication: SAME_EVENT_ID_SCHEMA_VERSION_AND_PAYLOAD
    consumerDeduplication: eventId
    projectionReplayAllowed: true
    externalSideEffectReplay: FORBIDDEN_PROJECTION_REPLAY_ONLY
  producer:
    module: payment
    aggregate: Payment
    commandRefs:
    - PAY-CMD-001
    operationRefs:
    - PAY-OP-001
    transitionRefs: []
- id: PAY-EVT-002
  name: PaymentAuthorizationCheckingStarted
  factKind: AUTHORIZATION_CHECKING_STARTED
  classification: PAYMENT_DOMAIN_EVENT
  role: PROCESS_REQUEST
  schemaVersion: 1
  description: Payment has durably requested authorization-evidence evaluation.
  payloadFields:
  - name: startedAt
    type: Instant
    required: true
    classification: INTERNAL_NON_SENSITIVE
  consumers:
  - module: security
    purpose: Resolve and validate canonical TRESOR PAY authorization evidence.
    sideEffect: IDEMPOTENT_SECURITY_VALIDATION
    idempotency: eventId
  - module: integration
    purpose: Coordinate local token/JWKS validation without exposing credentials to Payment.
    sideEffect: IDEMPOTENT_SECURITY_VALIDATION
    idempotency: eventId
