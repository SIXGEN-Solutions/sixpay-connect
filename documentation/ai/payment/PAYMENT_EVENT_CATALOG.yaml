  requiredPropertiesPerEvent:
    - "producer"
    - "consumers"
    - "minimalData"
    - "sensitiveDataForbidden"
    - "aggregateKey"
    - "eventId"
    - "correlation"
    - "version"
    - "replayPolicy"
  requestedEventsCovered: "15/15"
  normativeEventsDefined: 16
  schemaVersions:
    "1": 16
  producerCounts:
    payment: 15
    notification: 1

exitCriteria:
  - criterion: "All 15 requested candidate events are defined."
    satisfied: true
  - criterion: "PaymentFailed closes the FAILED-state and ObservedCustomer gap."
    satisfied: true
  - criterion: "Every event declares all nine required property groups."
    satisfied: true
  - criterion: "Envelope is compatible with IntegrationEventEnvelope."
    satisfied: true
  - criterion: "Every event inherits the sensitive-data denylist."
    satisfied: true
  - criterion: "Every event has an immutable eventId and schemaVersion 1."
    satisfied: true
  - criterion: "Every event defines safe replay and consumer deduplication."
    satisfied: true
  - criterion: "Financial and notification side effects are protected from replay."
    satisfied: true
  - criterion: "State-machine naming differences are mapped."
    satisfied: true

