  sensitiveDataForbidden: []
  replayPolicy:
    publication: SAME_EVENT_ID_SCHEMA_VERSION_AND_PAYLOAD
    consumerDeduplication: eventId
    projectionReplayAllowed: true
    externalSideEffectReplay: REVALIDATION_ALLOWED_BY_EVENT_ID_NO_FINANCIAL_EFFECT
  producer:
    module: payment
    aggregate: Payment
    commandRefs:
    - PAY-CMD-002
    operationRefs:
    - PAY-OP-002
    transitionRefs:
    - PAY-TR-001
