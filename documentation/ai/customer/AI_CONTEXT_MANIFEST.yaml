contracts:
  interoperability:
    - name: "TRESOR PAY Authorization Request"
      direction: "inbound"
      path: "planned:documentation/contracts/tresorpay/subscription-request-v1"
      approved: false
    - name: "TRESOR PAY Authorization Decision"
      direction: "outbound"
      path: "planned:documentation/contracts/tresorpay/subscription-decision-v1"
      approved: false
    - name: "Amplitude Customer and Account Verification"
      direction: "outbound"
      path: "planned:documentation/contracts/amplitude/customer-verification-v1"
      approved: false
  openapi:
    - path: "backend/customer/src/main/resources/openapi/customer-api-v1.yaml"
      version: "v1-planned"
      operations:
        - "searchCustomers"
        - "getCustomer"
        - "getCustomerAccounts"
        - "verifyCustomer"
      approved: false
  events:
    - path: "backend/customer/src/main/java/com/sixpay/customer/events"
      name: "CustomerEligibilityVerifiedIntegrationEvent"
      version: "v1-planned"
      approved: false
  migrations:
    - path: "backend/customer/src/main/resources/db/migration"
      destructive: false
      approved: false

