    definition: >-
      Reusable models for future AI generation campaigns; templates are
      instructions, not project-state evidence.
    explicitDocuments:
      - AI_CONTEXT_MANIFEST_TEMPLATE.yaml
      - AI_GENERATION_REPORT_TEMPLATE.md
