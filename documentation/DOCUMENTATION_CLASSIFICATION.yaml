schemaVersion: "1.0"
project: SIXPAY CONNECT
owner: repository-baseline-consolidation-cleanup
purpose: >-
  Single classification index for documentation retention and active
  Master Prompt context selection.

categories:
  CANONICAL:
    definition: >-
      Current-state architecture, approved requirements, active contracts
      and stable navigation/gates. These may drive the Master Prompt,
      subject to ENGINEERING_CONTEXT.md precedence.
    roots:
      - documentation/architecture/
      - documentation/contracts/
      - documentation/domains/
    explicit:
      - documentation/README.md
      - documentation/requirements/README.md
      - documentation/ai/README.md
      - ENGINEERING_CONTEXT.md

  REFERENCE_SOURCE:
    definition: >-
      External PDF/DOCX source material and supporting implementation
      evidence. It is retained for traceability and must not override
      canonical Markdown/YAML architecture or active contracts.
    paths:
      - documentation/requirements/cdc/*.pdf
      - documentation/requirements/cdc/*.docx
      - documentation/requirements/user-stories/*.docx
      - documentation/architecture/tresorpay/*.pdf
      - documentation/architecture/tresorpay/*.docx
      - documentation/architecture/*.docx
    aiRule: >-
      Non-historical AI briefs and manifests are reference material and
      are selected only when the active domain manifest or canonical
      documentation requires them.

  HISTORICAL:
    definition: >-
      Phase, lot, preflight, implementation-plan and gap-analysis assets
      retained for traceability. They are not active Master Prompt input.
    explicitDocuments:
      - documentation/ai/payment/PAYMENT_BACKEND_LOT_3_9_RECONCILIATION_TFJ.md
      - documentation/ai/payment/PAYMENT_BACKEND_LOT_3_12_OBSERVABILITY.md
