openapi: 3.1.0
info:
  title: SIXPAY CONNECT - Internal Payment Query API
  version: 1.0.0
  description: |
    Read-only internal API for authorized operational consultation of SIXPAY
    Payments. It exposes masked read projections and never loads or mutates the
    Payment aggregate. Timeline and immutable audit evidence are exposed by the
    dedicated Payment Audit Query API.
  license:
    name: SIXGEN Solutions Proprietary
    url: https://github.com/SIXGEN-Solutions/sixpay-connect/blob/main/LICENSE.md
  x-sixpay-contract:
    registryId: payment-query-api-v1
    gate: IA-0.5P_PAYMENT_CONTRACT_PACK
    phaseStep: "1.7"
    lifecycleStatus: ACTIVE_MVP
    approvalStatus: PENDING_APPROVAL
    generationPolicy: REFERENCE_ONLY
    codeGenerationAllowed: false
    domain: payment
    businessOwner: reporting
    securityOwner: security
    capability: PAYMENT_QUERY
    direction: INTERNAL_CLIENT_TO_SIXPAY
    dataClassification: CONFIDENTIAL
    readOnly: true
    limitations:
      - NO_PAYMENT_MUTATION
      - NO_UNMASKED_BANK_ACCOUNT
      - NO_SUBSCRIPTION_LIFECYCLE_DATA
      - NO_AUDIT_EVIDENCE_PAYLOAD
servers:
  - url: https://sixpay-api.example
    description: Environment-specific internal SIXPAY endpoint
security:
  - oauth2:
      - payment.read
tags:
  - name: Payments
    description: Masked read-only Payment projections.
paths:
  /internal/api/v1/payments:
    get:
      tags: [Payments]
      operationId: searchPayments
      summary: Search Payments with stable cursor pagination
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: paymentReference
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: tresorPayRequestId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: observedCustomerId
          in: query
          schema:
            type: string
            format: uuid
        - name: financialInstitutionCode
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: reasonCode
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: amountMin
          in: query
          schema:
            type: number
            minimum: 0
        - name: amountMax
          in: query
          schema:
            type: number
            minimum: 0
        - name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - CREATED_AT_ASC
              - CREATED_AT_DESC
              - UPDATED_AT_ASC
              - UPDATED_AT_DESC
            default: CREATED_AT_DESC
      responses:
        '200':
          description: Stable page of masked Payment summaries
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/api/v1/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Read a masked Payment detail projection
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment detail
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example/oauth2/authorize
          tokenUrl: https://identity.example/oauth2/token
          scopes:
            payment.read: Read masked Payment projections
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    CorrelationId:
      description: Echo of the request correlation identifier
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid filter or malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Authentication is required
    Forbidden:
      description: Access is denied or intentionally concealed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Payment not found or not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Query rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Internal query failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: Query projection temporarily unavailable
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    PaymentStatus:
      type: string
      enum:
        - RECEIVED
        - AUTHORIZATION_CHECKING
        - BANKING_CHECKING
        - REJECTED
        - APPROVED
        - POSTING
        - ACCOUNTING_OUTCOME_UNKNOWN
        - DEBITED
        - CUT_CREDITED
        - REVERSAL_REQUIRED
        - REVERSAL_PENDING
        - REVERSED
        - FAILED
        - NOTIFIED
        - PENDING_END_OF_DAY_CONFIRMATION
        - TREASURY_INTEGRATED
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    MaskedAccountReference:
      type: object
      additionalProperties: false
      required: [reference, maskedValue]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 128
        maskedValue:
          type: string
          minLength: 1
          maxLength: 32
          examples:
            - "•••• 1234"
    PaymentSummary:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - paymentReference
        - tresorPayRequestId
        - financialInstitutionCode
        - amount
        - status
        - createdAt
        - updatedAt
      properties:
        paymentId:
          type: string
          format: uuid
        paymentReference:
          type: string
        tresorPayRequestId:
          type: string
        observedCustomerId:
          type:
            - string
            - 'null'
          format: uuid
        financialInstitutionCode:
          type: string
        debtorAccount:
          $ref: '#/components/schemas/MaskedAccountReference'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reasonCode:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finalizedAt:
          type:
            - string
            - 'null'
          format: date-time
    PaymentSearchPage:
      type: object
      additionalProperties: false
      required: [items, size, hasMore, snapshotAt]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSummary'
        size:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        nextCursor:
          type:
            - string
            - 'null'
        snapshotAt:
          type: string
          format: date-time
    BankingVerificationSummary:
      type: object
      additionalProperties: false
      required: [verificationId, outcome, observedAt]
      properties:
        verificationId:
          type: string
        outcome:
          type: string
          enum: [VERIFIED, REJECTED, DEFERRED, FAILED]
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
        observedAt:
          type: string
          format: date-time
    PostingSummary:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        bankPostingReference:
          type:
            - string
            - 'null'
        outcome:
          type: string
          enum:
            - NOT_REQUESTED
            - PENDING
            - UNKNOWN
            - DEBIT_CONFIRMED
            - CUT_CREDIT_CONFIRMED
            - FAILED
            - PARTIAL
        observedAt:
          type:
            - string
            - 'null'
          format: date-time
    TfjSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_APPLICABLE, PENDING, INTEGRATED, FAILED, QUARANTINED]
        businessDate:
          type:
            - string
            - 'null'
          format: date
        confirmedAt:
          type:
            - string
            - 'null'
          format: date-time
    NotificationSummary:
      type: object
      additionalProperties: false
      required: [type, status]
      properties:
        type:
          type: string
          enum: [IMMEDIATE, TREASURY_FINAL, REVERSAL]
        status:
          type: string
          enum: [NOT_REQUESTED, PENDING, DELIVERED, FAILED, DLQ]
        eventId:
          type:
            - string
            - 'null'
          format: uuid
        lastAttemptAt:
          type:
            - string
            - 'null'
          format: date-time
    ReversalSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_REQUIRED, REQUIRED, PENDING, UNKNOWN, REVERSED, FAILED]
        reversalReference:
          type:
            - string
            - 'null'
        observedAt:
          type:
            - string
            - 'null'
          format: date-time
    PaymentDetail:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - paymentReference
        - tresorPayRequestId
        - financialInstitutionCode
        - amount
        - status
        - createdAt
        - updatedAt
        - correlationId
        - aggregateVersion
        - notifications
      properties:
        paymentId:
          type: string
          format: uuid
        paymentReference:
          type: string
        tresorPayRequestId:
          type: string
        observedCustomerId:
          type:
            - string
            - 'null'
          format: uuid
        financialInstitutionCode:
          type: string
        debtorAccount:
          $ref: '#/components/schemas/MaskedAccountReference'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reasonCode:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finalizedAt:
          type:
            - string
            - 'null'
          format: date-time
        correlationId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          format: int64
          minimum: 0
        bankingVerification:
          oneOf:
            - $ref: '#/components/schemas/BankingVerificationSummary'
            - type: 'null'
        posting:
          oneOf:
            - $ref: '#/components/schemas/PostingSummary'
            - type: 'null'
        tfj:
          oneOf:
            - $ref: '#/components/schemas/TfjSummary'
            - type: 'null'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSummary'
        reversal:
          oneOf:
            - $ref: '#/components/schemas/ReversalSummary'
            - type: 'null'
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        detail:
          type: string
        retryAfter:
          type: integer
          minimum: 1
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
