openapi: 3.1.0
info:
  title: SIXPAY CONNECT - Internal Security User Administration API
  version: 1.0.0
  description: |
    Canonical ADMIN-only contract for SIXPAY Security user administration.
    It covers canonical user accounts, authorization assignments, local authentication,
    linked OIDC/LDAP identities, LDAP/Active Directory user discovery and transactional
    LDAP provisioning into SIXPAY. Authentication runtime endpoints remain outside
    this contract. LDAP/Active Directory remains authoritative for directory identity
    and credentials; SIXPAY remains authoritative for application roles and permissions.
  x-sixpay-contract:
    registryId: security-user-administration-api-v1
    gate: FS-2_REPOSITORY_BASELINE_CONSOLIDATION
    phaseStep: FS-2.1.3
    lifecycleStatus: ACTIVE_MVP
    approvalStatus: APPROVED
    generationPolicy: ACTIVE
    codeGenerationAllowed: true
    domain: security
    businessOwner: security
    deliveryBoundary: administration
    securityOwner: security
    capability: SECURITY_USER_ADMINISTRATION
    direction: INTERNAL_CLIENT_TO_SIXPAY
    dataClassification: RESTRICTED
    sourceSystem: SIXPAY
    systemOfRecord: SIXPAY
servers:
  - url: https://sixpay-api.example
security:
  - bearerAuth: []
tags:
  - name: Security User Administration
paths:
  /internal/api/v1/administration/directory-users/{username}:
    get:
      tags: [Security User Administration]
      operationId: getDirectoryUser
      summary: Resolve one LDAP/Active Directory user by configured login identifier
      description: |
        Performs an ADMIN-only, read-only directory lookup using the configured LDAP
        service account. The lookup never asks for or receives the directory user's
        password and never mutates SIXPAY state. The first approved search mode is an
        exact lookup by the configured directory login identifier. Fuzzy, name, email
        and bulk searches are outside this contract version.
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters:
        - {$ref: '#/components/parameters/DirectoryUsername'}
      responses:
        '200':
          description: Directory identity verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DirectoryUserView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/DirectoryUserNotFound'}
        '409': {$ref: '#/components/responses/DirectoryUserAmbiguous'}
        '503': {$ref: '#/components/responses/DirectoryUnavailable'}
  /internal/api/v1/administration/directory-users/{username}/provisioning:
    post:
      tags: [Security User Administration]
      operationId: provisionDirectoryUser
      summary: Provision one verified LDAP/Active Directory identity into SIXPAY
      description: |
        Creates the canonical SIXPAY user, assigns SIXPAY-owned roles and permissions,
        links the immutable LDAP identity and records the administrative audit through
        one server-side application boundary. The server re-resolves the directory
        identity before mutation. The request never contains a directory password,
        trustDomain or objectGUID. No LDAP group is converted into a SIXPAY role or
        permission. An existing SIXPAY username is an explicit conflict and is never
        auto-linked.
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters:
        - {$ref: '#/components/parameters/DirectoryUsername'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionDirectoryUserRequest'}
      responses:
        '201':
          description: Directory user provisioned as a canonical SIXPAY user
          headers:
            Location: {schema: {type: string, format: uri}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/DirectoryUserNotFound'}
        '409': {$ref: '#/components/responses/ProvisioningConflict'}
        '422': {$ref: '#/components/responses/DirectoryUserNotProvisionable'}
        '503': {$ref: '#/components/responses/DirectoryUnavailable'}
  /internal/api/v1/administration/users:
    get:
      tags: [Security User Administration]
      operationId: listSecurityUsers
      summary: List SIXPAY security users
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      responses:
        '200':
          description: Security users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SecurityUserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Security User Administration]
      operationId: createSecurityUser
      summary: Create a SIXPAY security user
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSecurityUserRequest'}
      responses:
        '201':
          description: Security user created
          headers:
            Location: {schema: {type: string, format: uri}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /internal/api/v1/administration/users/{userId}:
    get:
      tags: [Security User Administration]
      operationId: getSecurityUser
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Security User Administration]
      operationId: updateSecurityUser
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSecurityUserRequest'}
      responses:
        '200':
          description: Updated security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Security User Administration]
      operationId: deleteSecurityUser
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '204': {description: Security user deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/enable:
    post:
      tags: [Security User Administration]
      operationId: enableSecurityUser
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Enabled security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/disable:
    post:
      tags: [Security User Administration]
      operationId: disableSecurityUser
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Disabled security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/authentication-methods/local:
    put:
      tags: [Security User Administration]
      operationId: setLocalAuthenticationMethod
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetAuthenticationMethodRequest'}
      responses:
        '200':
          description: Updated security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/local-password-reset:
    post:
      tags: [Security User Administration]
      operationId: resetLocalPassword
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetLocalPasswordRequest'}
      responses:
        '200':
          description: Updated security user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/identities/oidc:
    post:
      tags: [Security User Administration]
      operationId: linkOidcIdentity
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkOidcIdentityRequest'}
      responses:
        '200':
          description: Security user with linked OIDC identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/identities/ldap:
    post:
      tags: [Security User Administration]
      operationId: linkLdapIdentity
      summary: Link a trusted LDAP identity to a canonical SIXPAY user
      description: |
        Links the stable LDAP identity `(LDAP, trustDomain, stableSubject)` to
        the canonical SIXPAY account. For the approved Active Directory
        profile, stableSubject is the immutable objectGUID. DN, username,
        email and LDAP groups are not durable linking keys.
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkLdapIdentityRequest'}
      responses:
        '200':
          description: Security user with linked LDAP identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/api/v1/administration/users/{userId}/identities/{identityId}:
    delete:
      tags: [Security User Administration]
      operationId: unlinkExternalIdentity
      x-sixpay-authorization: {requiredRoles: [ADMIN]}
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/IdentityId'}
      responses:
        '200':
          description: Security user with external OIDC or LDAP identity unlinked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdentityId:
      name: identityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DirectoryUsername:
      name: username
      in: path
      required: true
      description: |
        Exact directory login identifier using the configured LDAP/Active Directory
        login attribute. Other search modes are intentionally outside this contract version.
      schema:
        type: string
        minLength: 1
        maxLength: 150
  responses:
    BadRequest:
      description: Validation or request error
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: ROLE_ADMIN is required
    NotFound:
      description: Security user or identity not found
    DirectoryUserNotFound:
      description: No directory user matches the requested identifier
    DirectoryUserAmbiguous:
      description: The configured exact directory lookup resolved more than one entry
    DirectoryUnavailable:
      description: The configured LDAP/Active Directory service is unavailable or the lookup cannot be completed safely
    DirectoryUserNotProvisionable:
      description: Directory identity exists but its account state is not provisionable
    ProvisioningConflict:
      description: |
        Provisioning conflict. This includes an LDAP identity already linked to SIXPAY
        or an existing SIXPAY username. Existing SIXPAY accounts are never auto-linked
        by this operation.
  schemas:
    SecurityUserAccountStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    AuthenticationIdentityType:
      type: string
      enum: [LOCAL, OIDC, LDAP]
    DirectoryAccountStatus:
      type: string
      description: |
        Normalized LDAP/Active Directory account state exposed to administrators.
        Only ACTIVE is provisionable by this contract version.
      enum:
        - ACTIVE
        - DISABLED
        - LOCKED
        - EXPIRED
        - PASSWORD_EXPIRED
        - PASSWORD_CHANGE_REQUIRED
    SecurityAuditEventType:
      type: string
      enum: [LOGIN_SUCCESS, LOGIN_FAILURE, LOGOUT, PASSWORD_CHANGED, PASSWORD_RESET, ACCOUNT_LOCKED, OIDC_LOGIN_SUCCESS, OIDC_LOGIN_FAILURE, IDENTITY_LINKED, IDENTITY_UNLINKED, AUTH_METHOD_ENABLED, AUTH_METHOD_DISABLED, USER_CREATED, USER_UPDATED, USER_ENABLED, USER_DISABLED, USER_DELETED]
    DirectoryUserView:
      type: object
      additionalProperties: false
      required: [username, displayName, email, accountStatus, stableSubject]
      properties:
        username:
          type: string
          maxLength: 150
          description: Directory login identifier resolved by the configured exact lookup.
        displayName:
          type: [string, 'null']
          maxLength: 255
          description: Display name returned by the directory when available.
        email:
          type: [string, 'null']
          format: email
          maxLength: 320
          description: Email returned by the directory when available.
        accountStatus:
          $ref: '#/components/schemas/DirectoryAccountStatus'
        stableSubject:
          type: string
          maxLength: 255
          readOnly: true
          description: |
            Immutable technical directory subject transported by the API; objectGUID
            for the approved Active Directory profile. It is not an administrator-editable
            field and is not accepted by the provisioning request.
    ProvisionDirectoryUserRequest:
      type: object
      additionalProperties: false
      required: [roles, permissions]
      properties:
        roles:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 100}
          description: SIXPAY-owned roles selected explicitly by the administrator.
        permissions:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 150}
          description: SIXPAY-owned permissions selected explicitly by the administrator.
    CreateSecurityUserRequest:
      type: object
      required: [username, roles, permissions, localAuthenticationEnabled]
      properties:
        username: {type: string, maxLength: 150}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 100}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 150}
        localAuthenticationEnabled: {type: boolean}
        initialPassword: {type: [string, 'null'], minLength: 12, maxLength: 200}
    UpdateSecurityUserRequest:
      type: object
      required: [username, roles, permissions]
      properties:
        username: {type: string, maxLength: 150}
        email: {type: [string, 'null'], format: email, maxLength: 320}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 100}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 150}
    SetAuthenticationMethodRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    ResetLocalPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: {type: string, minLength: 12, maxLength: 200}
    LinkOidcIdentityRequest:
      type: object
      required: [provider, providerSubject]
      properties:
        provider: {type: string, maxLength: 500}
        providerSubject: {type: string, maxLength: 255}
    LinkLdapIdentityRequest:
      type: object
      required: [trustDomain, stableSubject]
      additionalProperties: false
      properties:
        trustDomain:
          type: string
          minLength: 1
          maxLength: 500
          description: Stable configured LDAP trust-domain identifier.
        stableSubject:
          type: string
          minLength: 1
          maxLength: 255
          description: Immutable LDAP subject; objectGUID for the approved Active Directory profile.
    SecurityUserSummary:
      type: object
      required: [id, username, status, localEnabled, oidcLinked]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/SecurityUserAccountStatus'}
        localEnabled: {type: boolean}
        oidcLinked: {type: boolean}
        lastAuthenticationAt: {type: [string, 'null'], format: date-time}
    SecurityIdentityView:
      type: object
      required: [id, identityType, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        identityType: {$ref: '#/components/schemas/AuthenticationIdentityType'}
        provider: {type: [string, 'null']}
        providerSubject: {type: [string, 'null']}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SecurityAuditView:
      type: object
      required: [eventType, occurredAt]
      properties:
        eventType: {$ref: '#/components/schemas/SecurityAuditEventType'}
        actorSubject: {type: [string, 'null']}
        provider: {type: [string, 'null']}
        detail: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
    SecurityUserDetail:
      type: object
      required: [id, username, status, localEnabled, oidcLinked, roles, permissions, identities, recentAuthenticationEvents]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/SecurityUserAccountStatus'}
        localEnabled: {type: boolean}
        oidcLinked: {type: boolean}
        roles:
          type: array
          uniqueItems: true
          items: {type: string}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
        identities:
          type: array
          items: {$ref: '#/components/schemas/SecurityIdentityView'}
        recentAuthenticationEvents:
          type: array
          items: {$ref: '#/components/schemas/SecurityAuditView'}
