schemaVersion: "1.0"
registry:
  id: "sixpay-contract-registry"
  baseline: "REPOSITORY_BASELINE_CONSOLIDATION"
  gate: "FS-2_REPOSITORY_BASELINE_CONSOLIDATION"
  step: "FS-2.1.0_CONTRACT_REGISTRY_NORMALIZATION"
  repository: "SIXGEN-Solutions/sixpay-connect"
  classificationDate: "2026-08-23"
  gateSemantics: "GLOBAL_REGISTRY_GOVERNANCE"
  historicalContractGatesPreserved: true
  description: >-
    Canonical cross-domain SIXPAY contract registry for the repository baseline.
    The registry-level gate identifies the current repository consolidation
    activity only. Contract-level gate and phaseStep fields preserve the
    historical delivery gate under which each capability was defined or
    approved and remain authoritative for contract traceability.

classificationModel:
  domains:
    payment: "Payment bounded capability."
    customer: "Customer and observed-customer capabilities."
    accounting: "Accounting bounded capability."
    reporting: "Reporting and privileged audit capabilities."
    administration: "Operational administration capabilities."
    security: "Security, identity and authorization capabilities."
    notification: "Operational notification capabilities."
    integration: "External integration contracts and integration-facing capabilities."
    subscription: "Subscription lifecycle capabilities."
    partner: "Partner bounded capability."

  ownershipValues:
    payment: "Payment domain owner."
    customer: "Customer domain owner."
    accounting: "Accounting domain owner."
    reporting: "Reporting domain owner."
    administration: "Administration domain owner."
    security: "Security, identity and authorization owner."
    notification: "Notification domain owner."
    integration: "Integration delivery/transport owner."
    subscription: "Subscription domain owner."
    partner: "Partner domain owner."
    bootstrap: "Composition/bootstrap delivery owner."

  systems:
    SIXPAY: "SIXPAY CONNECT."
    TRESOR_PAY: "TRESOR PAY."
    AMPLITUDE: "Amplitude Core Banking."
    EMAIL_PROVIDER: "Configured operational email provider."

  directionEndpoints:
    SIXPAY: "SIXPAY CONNECT."
    TRESOR_PAY: "TRESOR PAY."
    AMPLITUDE: "Amplitude Core Banking."
    INTERNAL_CLIENT: "Authenticated internal API client."
    INTERNAL_DOMAIN: "A SIXPAY bounded domain producing an internal semantic fact."
    NOTIFICATION: "SIXPAY Notification capability."
    EMAIL_PROVIDER: "Configured email provider."
    PARTNER: "External SIXPAY partner."

  dataClassifications:
    PUBLIC: "Public data."
    INTERNAL: "Internal operational data."
    CONFIDENTIAL: "Confidential business/customer data."
    RESTRICTED: "Restricted privileged or audit data."

  paginationModes:
    STABLE_CURSOR: "Stable cursor pagination."
    OFFSET_PAGE: "Offset/page pagination."
    NOT_REQUIRED: "Bounded response; pagination not required."

  lifecycleStatuses:
    ACTIVE_MVP:
      description: "Contract applicable to the current MVP delivery."
    REFERENCE_MVP:
      description: "Reusable reference contract for the MVP, not sufficient alone to implement the end-to-end flow."
    DEFERRED_FUTURE:
      description: "Contract preserved for an explicitly deferred evolution."
    SUPERSEDED:
      description: "Contract retained for traceability but replaced by another version."

  approvalStatuses:
    DRAFT: "Not approved for implementation."
    PENDING_APPROVAL: "Technically prepared and awaiting formal approval."
    PENDING_BANK_APPROVAL: "SIXPAY baseline prepared; authoritative bank/provider approval is still required."
    APPROVED: "Approved by the required authorities."

  generationPolicy:
    ACTIVE: "May be used for generation when approved and when all dependencies are available."
    REFERENCE_ONLY: "May inform another contract but cannot independently trigger code generation."
    EXCLUDED: "Must not be used to generate the current MVP."

  physicalContractCardinality:
    ONE_CAPABILITY_TO_ONE_PHYSICAL_CONTRACT:
      description: >-
        Default mapping. One registry capability references one physical
        contract and the physical contract identifies that capability.
    MANY_CAPABILITIES_TO_ONE_PHYSICAL_CONTRACT:
      description: >-
        Explicit consolidation mapping. Multiple registry capabilities may
        reference the same physical contract when they share a coherent API
        ownership boundary. Registry IDs and capability IDs remain unique.
      requirements:
        - "Registry contract ids remain globally unique"
        - "Registry capability values remain globally unique"
        - "Shared physical path is allowed"
        - "All registry entries sharing a path use the same domain"
        - "All registry entries sharing a path use the same businessOwner"
        - "The physical contract declares info.x-sixpay-contract.registryIds"
        - "The physical contract declares info.x-sixpay-contract.capabilities"
        - "Physical metadata exactly matches registry entries sharing the path"
contracts:
  - id: "tresorpay-payment-request-api-v1"
    path: "documentation/contracts/tresorpay/tresorpay-payment-request-api-v1.yaml"
    domain: "payment"
    capability: "PAYMENT_REQUEST"
    direction: "TRESOR_PAY_TO_SIXPAY"
    sourceSystem: "TRESOR_PAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.1"
    security:
      active:
        - "BEARER_AUTHORIZATION_TOKEN"
        - "SUBSCRIPTION_KEY"
        - "LOCAL_SIGNED_TOKEN_VALIDATION"
      deferred:
        - "OAUTH2_CLIENT_CREDENTIALS"
        - "MUTUAL_TLS"
    mvpUsage:
      included: true
      purpose:
        - "Receive a TRESOR PAY payment order"
        - "Enforce idempotency and correlation"
        - "Durably persist Payment before any Amplitude call"
        - "Acknowledge intake without claiming banking success"
      constraints:
        - "TRESOR PAY remains the subscription system of record"
        - "No local subscription validation"
        - "Subscription authorization is attested by a short-lived signed JWT"
        - "No synchronous TRESOR PAY subscription-verification call in the MVP"
        - "Treasury beneficiaries must resolve to bank-controlled configuration"
        - "Credentials are forbidden in the JSON payload"
    approvalPrerequisite:
      - "TRESOR PAY contract owner approval"
      - "SIXPAY Payment and Integration approval"
      - "Security approval"
      - "Completion and approval of the full IA-0.5P Payment Contract Pack"

  - id: "tresorpay-payment-confirmation-api-v1"
    path: "documentation/contracts/tresorpay/tresorpay-payment-confirmation-api-v1.yaml"
    domain: "payment"
    businessOwner: "payment"
    deliveryOwner: "integration"
    capability: "PAYMENT_CONFIRMATION"
    direction: "TRESOR_PAY_TO_SIXPAY"
    sourceSystem: "TRESOR_PAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "PAYMENT_COMPLETION"
    phaseStep: "0.4.2"
    security:
      status: "PENDING_RECONCILIATION"
      reason: "Existing TRESOR PAY Payment Request contract and current Payment runtime use different active security profiles."
    mvpUsage:
      included: true
      purpose:
        - "Create and send a customer confirmation challenge for an existing Payment"
        - "Synchronously verify the customer OTP"
        - "Replace and resend the current challenge"
        - "Read the current normalized challenge state"
        - "Enforce idempotency and authoritative recovery semantics"
      constraints:
        - "Payment remains the aggregate root"
        - "At most one challenge is active per Payment"
        - "La Regionale owns OTP generation, storage, delivery and verification"
        - "SIXPAY never persists OTP"
        - "challengeReference remains internal to SIXPAY"
        - "Create and resend have no public request body"
        - "GET returns the current challenge only"
        - "No public revoke endpoint"
        - "OTP success does not establish funds availability or posting success"
        - "Resend maximum and cooldown remain bank-controlled and are not invented"
    approvalPrerequisite:
      - "TRESOR PAY contract owner approval"
      - "SIXPAY Payment and Integration approval"
      - "Security approval of the reconciled public authentication profile"
      - "La Regionale confirms delivery-failure and recovery semantics"
      - "La Regionale provides resend maximum and cooldown"

  - id: "amplitude-customer-verification-api-v1"
    path: "documentation/contracts/amplitude/amplitude-customer-verification-api-v1.yaml"
    domain: "integration"
    capability: "BANKING_CUSTOMER_AND_ACCOUNT_VERIFICATION"
    direction: "SIXPAY_TO_AMPLITUDE"
    systemOfRecord: "AMPLITUDE"
    lifecycleStatus: "REFERENCE_MVP"
    approvalStatus: "PENDING_BANK_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    reviewedForGate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    reviewStep: "1.3"
    reviewDecisionPath: "documentation/ai/payment/AMPLITUDE_CUSTOMER_VERIFICATION_PAYMENT_REVIEW.md"
    mvpUsage:
      included: true
      confirmedForPayment: true
      invocationPoint: "AFTER_PAYMENT_REQUEST_DURABLY_PERSISTED"
      purpose:
        - "Verify the banking customer and NIU"
        - "Retrieve banking identity and required KYC facts"
        - "Find accounts and verify account ownership and status"
        - "Detect blocks or oppositions"
      limitations:
        - "Does not authorize or manage a SIXPAY Customer subscription"
        - "Does not define funds-availability controls"
        - "Does not define debit or CUT-credit posting"
        - "Does not define end-of-day Treasury confirmation"
      progressionRule: "Only a VERIFIED outcome may authorize progression to funds control"
    configurable:
      - "timeout"
      - "retry"
      - "sla"

  - id: "amplitude-payment-posting-api-v1"
    path: "documentation/contracts/amplitude/amplitude-payment-posting-api-v1.yaml"
    domain: "integration"
    businessOwner: "accounting"
    capability: "FUNDS_CONTROL_PAYMENT_POSTING_AND_REVERSAL"
    direction: "SIXPAY_TO_AMPLITUDE"
    systemOfRecord: "AMPLITUDE"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_BANK_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.4"
    mvpUsage:
      included: true
      purpose:
        - "Perform a fresh execution-time account, funds, restriction and limit check"
        - "Optionally reserve and release funds when the bank approves the capability"
        - "Atomically debit the customer and credit the configured CUT"
        - "Return stable bank references and leg-level outcomes"
        - "Recover uncertain posting outcomes by idempotency key or bank reference"
        - "Request and track an explicit authorized reversal"
      constraints:
        - "Atomic debit and CUT credit is the preferred posting mode"
        - "CUT reference comes from protected bank configuration"
        - "A write timeout never proves failure"
        - "Unknown outcomes permit lookup only, never blind resubmission"
        - "Reversal requires a bank instruction or approved runbook"
        - "Posting success does not establish TFJ finality"
      relationshipToCustomerVerificationContract: >
        Execution-time checks are defense in depth and do not replace the
        dedicated customer/account/KYC verification defined by
        amplitude-customer-verification-api-v1.
    approvalPrerequisite:
      - "Amplitude approves atomic posting and partial-outcome semantics"
      - "Amplitude approves bank idempotency and authoritative lookup"
      - "Amplitude confirms reservation and reversal capabilities"
      - "SIXPAY Accounting, Payment, Integration, Security and Operations approve the contract"

  - id: "tresorpay-payment-status-webhook-v1"
    path: "documentation/contracts/tresorpay/tresorpay-payment-status-webhook-v1.yaml"
    domain: "integration"
    businessOwner: "payment"
    deliveryOwner: "notification"
    capability: "PAYMENT_STATUS_NOTIFICATION"
    direction: "SIXPAY_TO_TRESOR_PAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.5"
    mvpUsage:
      included: true
      eventTypes:
        - "PAYMENT_RECEIVED"
        - "PAYMENT_REJECTED"
        - "PAYMENT_PROCESSING"
        - "PAYMENT_DEBITED"
        - "CUT_CREDITED"
        - "PAYMENT_FAILED"
        - "PAYMENT_REVERSED"
      semantics:
        delivery: "AT_LEAST_ONCE"
        idempotencyKey: "eventId"
        attemptIdentifier: "deliveryId"
        ordering: "paymentVersion"
        durableAcceptance: "HTTP_204"
      constraints:
        - "PAYMENT_DEBITED is an intermediate fact"
        - "CUT_CREDITED does not establish TFJ finality"
        - "Delivery failure never changes Payment financial state"
        - "Operational replay preserves eventId and payload"
        - "Notification replay never triggers a financial replay"
    approvalPrerequisite:
      - "TRESOR PAY approves endpoint registration and event semantics"
      - "Security approves Bearer, Subscription Key and HMAC profile"
      - "Operations approves retry, DLQ, alert and replay procedures"

  - id: "amplitude-end-of-day-confirmation-api-v1"
    path: "documentation/contracts/amplitude/amplitude-end-of-day-confirmation-api-v1.yaml"
    domain: "integration"
    businessOwner: "accounting"
    lifecycleConsumer: "payment"
    capability: "END_OF_DAY_TREASURY_CONFIRMATION"
    primaryDirection: "AMPLITUDE_TO_SIXPAY"
    fallbackDirection: "SIXPAY_TO_AMPLITUDE"
    systemOfRecord: "AMPLITUDE"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_BANK_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.6"
    mvpUsage:
      included: true
      primaryMode: "AMPLITUDE_ASYNCHRONOUS_CONFIRMATION"
      fallbackMode: "SIXPAY_SCHEDULED_RECONCILIATION_QUERY"
      finalitySource: "AMPLITUDE_TFJ_RESULT"
      matchingKeys:
        - "FINANCIAL_INSTITUTION_CODE"
        - "BUSINESS_DATE"
        - "PAYMENT_REFERENCE"
        - "BANK_POSTING_REFERENCE"
      constraints:
        - "Only a matched successful result establishes TREASURY_INTEGRATED"
        - "An unmatched, ambiguous or conflicting result is quarantined"
        - "A quarantined result never changes Payment"
        - "A missing result keeps Payment pending and triggers the fallback query"
        - "TFJ delay alone never authorizes automatic reversal"
    approvalPrerequisite:
      - "Amplitude approves callback, lookup and business status semantics"
      - "Security approves mTLS plus HMAC for callback and OAuth2 plus mTLS for lookup"
      - "Accounting and Operations approve cutoff, quarantine and reconciliation procedures"

  - id: "tresorpay-treasury-integration-webhook-v1"
    path: "documentation/contracts/tresorpay/tresorpay-treasury-integration-webhook-v1.yaml"
    domain: "integration"
    businessOwner: "payment"
    deliveryOwner: "notification"
    capability: "TREASURY_INTEGRATION_NOTIFICATION"
    direction: "SIXPAY_TO_TRESOR_PAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.6"
    mvpUsage:
      included: true
      eventTypes:
        - "PENDING_END_OF_DAY_CONFIRMATION"
        - "TREASURY_INTEGRATED"
        - "TREASURY_INTEGRATION_FAILED"
      semantics:
        delivery: "AT_LEAST_ONCE"
        idempotencyKey: "eventId"
        attemptIdentifier: "deliveryId"
        ordering: "paymentVersion"
        durableAcceptance: "HTTP_204"
      constraints:
        - "TREASURY_INTEGRATED requires a durably persisted and uniquely matched Amplitude result"
        - "TREASURY_INTEGRATION_FAILED never commands an automatic reversal"
        - "Delivery failure never changes Payment financial state"
        - "Operational replay never triggers a financial replay"
    approvalPrerequisite:
      - "TRESOR PAY approves endpoint registration and event semantics"
      - "Security approves Bearer, Subscription Key and HMAC profile"
      - "Operations approves retry, DLQ, alert and replay procedures"

  - id: "payment-query-api-v1"
    path: "documentation/contracts/internal/payment-query-api-v1.yaml"
    domain: "payment"
    businessOwner: "reporting"
    securityOwner: "security"
    capability: "PAYMENT_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.7"
    security:
      authentication: "OIDC_OAUTH2_BEARER_JWT"
      scopes:
        - "payment.read"
      authorization: "RBAC_PLUS_SCOPE_PLUS_INSTITUTION_PERIMETER"
      dataClassification: "CONFIDENTIAL"
    mvpUsage:
      included: true
      readOnly: true
      pagination: "STABLE_CURSOR"
      purpose:
        - "List and filter masked Payment projections"
        - "Read Payment detail and current status"
        - "Read normalized banking, posting, notification, TFJ and reversal summaries"
      constraints:
        - "No Payment mutation"
        - "No unmasked bank account"
        - "No subscription lifecycle data"
        - "Timeline and immutable audit evidence remain in payment-audit-query-api-v1"

  - id: "observed-customer-query-api-v1"
    path: "documentation/contracts/internal/observed-customer-query-api-v1.yaml"
    domain: "customer"
    businessOwner: "reporting"
    securityOwner: "security"
    capability: "OBSERVED_CUSTOMER_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.7"
    security:
      authentication: "OIDC_OAUTH2_BEARER_JWT"
      scopes:
        - "observed-customer.read"
      authorization: "RBAC_PLUS_SCOPE_PLUS_INSTITUTION_PERIMETER"
      dataClassification: "CONFIDENTIAL"
    mvpUsage:
      included: true
      readOnly: true
      pagination: "STABLE_CURSOR"
      purpose:
        - "List and filter ObservedCustomer projections"
        - "Read projection freshness and observed institutions"
        - "List linked masked Payment references"
      constraints:
        - "ObservedCustomer remains non-authoritative"
        - "No customer or Amplitude mutation"
        - "No subscription lifecycle"
        - "No unmasked bank account"

  - id: "payment-audit-query-api-v1"
    path: "documentation/contracts/internal/payment-audit-query-api-v1.yaml"
    domain: "reporting"
    businessOwner: "reporting"
    securityOwner: "security"
    evidenceOwners:
      - "payment"
      - "customer"
      - "accounting"
      - "notification"
      - "integration"
    capability: "PAYMENT_AUDIT_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "IA-0.5P_PAYMENT_CONTRACT_PACK"
    phaseStep: "1.7"
    security:
      authentication: "OIDC_OAUTH2_BEARER_JWT"
      scopes:
        - "payment.audit.read"
        - "payment.audit.export"
      authorization: "AUDITOR_RBAC_PLUS_SCOPE_PLUS_PURPOSE"
      dataClassification: "RESTRICTED"
    mvpUsage:
      included: true
      readOnly: true
      pagination: "STABLE_CURSOR"
      purpose:
        - "Read ordered Payment lifecycle timelines"
        - "Search immutable Payment audit evidence"
        - "Request and retrieve controlled masked audit exports"
      constraints:
        - "Every consultation, denial and export is audited"
        - "No audit mutation"
        - "No operational replay or financial command"
        - "No raw external payload, credential, secret or unmasked account"

  - id: "tresorpay-authorization-request-api-v1"
    path: "documentation/contracts/tresorpay/tresorpay-authorization-request-api-v1.yaml"
    domain: "subscription"
    capability: "SUBSCRIPTION_AUTHORIZATION_REQUEST"
    direction: "TRESOR_PAY_TO_SIXPAY"
    systemOfRecord: "TRESOR_PAY"
    lifecycleStatus: "DEFERRED_FUTURE"
    approvalStatus: "DRAFT"
    generationPolicy: "EXCLUDED"
    codeGenerationAllowed: false
    mvpUsage:
      included: false
      reason: "For the MVP, subscription initiation and validation remain entirely in TRESOR PAY."
    futureUsage:
      purpose: "Allow a SIXPAY bank-agent interface to retrieve and process a pending TRESOR PAY subscription."
      prerequisite: "A future TRESOR PAY integration contract and explicit architecture approval."

  - id: "tresorpay-authorization-decision-webhook-v1"
    path: "documentation/contracts/tresorpay/tresorpay-authorization-decision-webhook-v1.yaml"
    domain: "subscription"
    capability: "SUBSCRIPTION_AUTHORIZATION_LIFECYCLE_NOTIFICATION"
    direction: "SIXPAY_TO_TRESOR_PAY"
    systemOfRecord: "TRESOR_PAY"
    lifecycleStatus: "DEFERRED_FUTURE"
    approvalStatus: "DRAFT"
    generationPolicy: "EXCLUDED"
    codeGenerationAllowed: false
    mvpUsage:
      included: false
      reason: "SIXPAY does not own or update the subscription lifecycle in the MVP."
    futureUsage:
      purpose: "Return a bank-agent decision to TRESOR PAY when the future SIXPAY-assisted subscription journey is activated."
      prerequisite: "Activation of the deferred subscription scope and explicit architecture approval."

  - id: "accounting-query-api-v1"
    path: "documentation/contracts/internal/accounting-query-api-v1.yaml"
    domain: "accounting"
    businessOwner: "accounting"
    securityOwner: "security"
    capability: "ACCOUNTING_BATCH_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "APPROVED"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "FS-1.3_ACCOUNTING_QUERY_CONTRACT"
    phaseStep: "FS-1.3"
    security:
      authentication: "SIXPAY_AUTHENTICATED_PRINCIPAL"
      roles:
        - "ADMIN"
        - "MANAGER"
        - "AUDITOR"
      dataClassification: "CONFIDENTIAL"
    mvpUsage:
      included: true
      readOnly: true
      pagination: "OFFSET_PAGE"
      purpose:
        - "List and filter Accounting batches"
        - "Read Accounting batch detail and items"
      constraints:
        - "No Accounting mutation"
        - "No provider command"
        - "No payment replay"

  - id: "administration-query-api-v1"
    path: "documentation/contracts/internal/administration-operational-api-v1.yaml"
    domain: "administration"
    businessOwner: "administration"
    securityOwner: "security"
    capability: "ADMINISTRATION_OPERATIONAL_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "FS-1.4_ADMINISTRATION_INCIDENTS_CONTRACT_GAP_CLOSURE"
    phaseStep: "FS-1.4.1"
    security:
      authentication: "SIXPAY_AUTHENTICATED_PRINCIPAL"
      authorization: "ROLE_BASED"
      roles:
        - "ADMIN"
      dataClassification: "INTERNAL"
    mvpUsage:
      included: true
      readOnly: true
      pagination: "NOT_REQUIRED"
      purpose:
        - "Read the operational Administration overview"
        - "Read effective runtime-backed operational settings"
        - "Read observable integration-health projections"
      constraints:
        - "No settings mutation"
        - "No integration mutation"
        - "No Security user or identity mutation"
        - "No mock or demo value may be treated as system-of-record data"

  - id: "incident-query-api-v1"
    path: "documentation/contracts/internal/administration-operational-api-v1.yaml"
    domain: "administration"
    businessOwner: "administration"
    securityOwner: "security"
    capability: "OPERATIONAL_INCIDENT_QUERY"
    direction: "INTERNAL_CLIENT_TO_SIXPAY"
    sourceSystem: "SIXPAY"
    systemOfRecord: "SIXPAY"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    gate: "FS-1.4_ADMINISTRATION_INCIDENTS_CONTRACT_GAP_CLOSURE"
    phaseStep: "FS-1.4.2"
    security:
      authentication: "SIXPAY_AUTHENTICATED_PRINCIPAL"
      authorization: "ROLE_BASED"
      roles:
