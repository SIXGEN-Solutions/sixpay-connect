openapi: 3.1.0

info:
  title: SIXPAY CONNECT - Amplitude Payment Confirmation API
  version: 1.0.0
  summary: Bank-owned customer confirmation challenge lifecycle for SIXPAY Payments.
  description: |
    Contract approved by SIXPAY for the SIXPAY -> Amplitude customer Payment
    confirmation boundary.

    Amplitude / La Regionale remains authoritative for challenge creation,
    OTP generation, OTP storage, OTP delivery, OTP verification, invalid
    attempt counting, lockout, expiry, replacement and revocation.

    SIXPAY never persists the OTP value.

    Successful OTP verification proves customer confirmation for the bound
    Payment only. It does not establish funds availability, successful debit,
    CUT credit or financial finality.

    Provider-native status values, provider-native business codes, final wire
    field names and remaining operational parameters must not be invented while
    La Regionale has not supplied them.

  x-sixpay-contract:
    registryId: "amplitude-payment-confirmation-api-v1"
    gate: "PAYMENT_COMPLETION"
    phaseStep: "0.4.3"
    lifecycleStatus: "ACTIVE_MVP"
    approvalStatus: "PENDING_BANK_APPROVAL"
    generationPolicy: "REFERENCE_ONLY"
    codeGenerationAllowed: false
    domain: "integration"
    businessOwner: "payment"
    deliveryOwner: "integration"
    capability: "BANKING_PAYMENT_CONFIRMATION"
    direction: "SIXPAY_TO_AMPLITUDE"
    sourceSystem: "SIXPAY"
    systemOfRecord: "AMPLITUDE"
    mvpIncluded: true
    approvedContractDesign:
      createSend: "POST /api/v1/payment-confirmation-challenges"
      verify: "POST /api/v1/payment-confirmation-challenges/{challengeReference}/verifications"
      replace: "POST /api/v1/payment-confirmation-challenges/{challengeReference}/replacements"
      lookupByChallenge: "GET /api/v1/payment-confirmation-challenges/{challengeReference}"
      revoke: "POST /api/v1/payment-confirmation-challenges/{challengeReference}/revocations"
      recoveryByIdempotencyKey: "GET /api/v1/payment-confirmation-challenge-lookups/{idempotencyKey}"
      correlationHeader: "X-Correlation-ID"
      institutionHeader: "X-Financial-Institution-Code"
      idempotencyConflictHttpStatus: 409
      securityProfile:
        - "OAUTH2_CLIENT_CREDENTIALS"
        - "MUTUAL_TLS"
    openDecisions:
      - "REVOKE_IDEMPOTENCY"
      - "PROVIDER_STATUS_VOCABULARY"
      - "PROVIDER_BUSINESS_CODE_VOCABULARY"
      - "FINAL_PROVIDER_WIRE_FIELD_NAMES_AND_SCHEMAS"
      - "RESEND_MAXIMUM_AND_COOLDOWN"
      - "DELIVERY_FAILURE_SEMANTICS"
      - "TIMEOUT_RATE_LIMIT_AND_RETRY_PARAMETERS"
      - "SAFE_VERIFY_IDEMPOTENCY_FINGERPRINT"
      - "POST_OTP_ONE_MINUTE_WINDOW_EXPIRY_BEHAVIOR"
    limitations:
      - "NO_FUNDS_AVAILABILITY_DECISION"
      - "NO_PAYMENT_POSTING"
      - "NO_CUT_CREDIT"
      - "NO_TFJ_FINALITY"
      - "NO_OTP_PERSISTENCE_BY_SIXPAY"

servers:
  - url: https://amplitude-api.example
    description: Environment-specific placeholder; real URLs remain external configuration.

security:
  - oauth2ClientCredentials:
      - amplitude.payment.confirmation
    mutualTLS: []

tags:
  - name: Payment confirmation challenges
    description: Bank-owned confirmation challenge lifecycle.
  - name: Payment confirmation recovery
    description: Authoritative recovery after uncertain transport outcomes.

paths:
  /api/v1/payment-confirmation-challenges:
    post:
      tags: [Payment confirmation challenges]
      operationId: createAmplitudePaymentConfirmationChallenge
      summary: Create and send a Payment confirmation challenge
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      description: |
        Creates and sends a bank-owned confirmation challenge bound to the
        supplied SIXPAY Payment, customer, debtor account and financial context.
        La Regionale selects the active contact and delivery channel.
        Same Idempotency-Key plus the same logical request returns the same
        result without generating another OTP. Same key plus a different
        logical request is a conflict.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentConfirmationChallengeRequest'
      responses:
        '200':
          description: Stable authoritative create/send business result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationChallengeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/payment-confirmation-challenges/{challengeReference}/verifications:
    post:
      tags: [Payment confirmation challenges]
      operationId: verifyAmplitudePaymentConfirmationChallenge
      summary: Verify the OTP for a confirmation challenge
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      description: |
        Synchronously verifies the transient OTP against the bank-owned challenge.
        SIXPAY never persists or reproduces the OTP. Replaying the same
        idempotent verification must not consume another OTP attempt. HTTP 200
        alone does not mean the OTP was accepted.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ChallengeReference'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPaymentConfirmationChallengeRequest' }
      responses:
        '200':
          description: Completed positive or negative authoritative verification result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationVerificationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChallengeNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/payment-confirmation-challenges/{challengeReference}/replacements:
    post:
      tags: [Payment confirmation challenges]
      operationId: replaceAmplitudePaymentConfirmationChallenge
      summary: Replace the current challenge and send a new OTP
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      description: |
        Creates a new logical challenge and a new OTP and permanently invalidates
        the previous challenge. La Regionale controls resend maximum and cooldown.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ChallengeReference'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacePaymentConfirmationChallengeRequest' }
      responses:
        '200':
          description: Stable authoritative challenge replacement result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationChallengeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChallengeNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/payment-confirmation-challenges/{challengeReference}:
    get:
      tags: [Payment confirmation challenges]
      operationId: getAmplitudePaymentConfirmationChallenge
      summary: Read the authoritative challenge status
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/ChallengeReference'
      responses:
        '200':
          description: Current authoritative challenge result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationChallengeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChallengeNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/payment-confirmation-challenge-lookups/{idempotencyKey}:
    get:
      tags: [Payment confirmation recovery]
      operationId: getAmplitudePaymentConfirmationByIdempotencyKey
      summary: Recover a confirmation operation by original idempotency key
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      description: |
        Authoritative recovery when create or replacement may have succeeded but
        SIXPAY did not receive challengeReference. Lookup is mandatory before
        any retry after an unknown outcome.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/IdempotencyKeyPath'
      responses:
        '200':
          description: Authoritative previously processed confirmation result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationChallengeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/payment-confirmation-challenges/{challengeReference}/revocations:
    post:
      tags: [Payment confirmation challenges]
      operationId: revokeAmplitudePaymentConfirmationChallenge
      summary: Revoke an active confirmation challenge
      x-sixpay-bank-approval: PENDING_BANK_APPROVAL
      x-sixpay-idempotency-status: OPEN_DECISION
      description: |
        Revokes an active challenge when Payment is cancelled or rejected before
        successful OTP confirmation. A VERIFIED challenge is not revocable.
        Revoke idempotency remains OPEN_DECISION.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/FinancialInstitutionCode'
        - $ref: '#/components/parameters/ChallengeReference'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokePaymentConfirmationChallengeRequest' }
      responses:
        '200':
          description: Stable authoritative revocation result.
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationChallengeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ChallengeNotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: Approved contract profile; operational token parameters remain environment configuration.
      flows:
        clientCredentials:
          tokenUrl: https://identity.amplitude.example/oauth2/token
          scopes:
            amplitude.payment.confirmation: Payment confirmation operations.
    mutualTLS:
      type: mutualTLS
      description: SIXPAY client certificate trusted by La Regionale.

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    FinancialInstitutionCode:
      name: X-Financial-Institution-Code
      in: header
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 35
        pattern: '^[A-Z0-9][A-Z0-9._-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque logical-operation key; must not contain OTP or sensitive banking data.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    IdempotencyKeyPath:
      name: idempotencyKey
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    ChallengeReference:
      name: challengeReference
      in: path
      required: true
      description: Unique opaque bank-generated challenge reference.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    CorrelationId:
      description: End-to-end correlation identifier.
      required: true
      schema: { type: string, format: uuid }

  schemas:
    PaymentReference:
      type: string
      minLength: 30
      maxLength: 30
      pattern: '^PAY-[0-9A-HJKMNP-TV-Z]{26}$'
    CustomerReference:
      type: string
      minLength: 1
      maxLength: 100
      description: Opaque canonical banking customer reference.
    AccountReference:
      type: string
      minLength: 1
      maxLength: 100
      description: Opaque canonical Amplitude debtor-account reference.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    CreatePaymentConfirmationChallengeRequest:
      type: object
      additionalProperties: false
      required: [paymentReference, customerReference, debtorAccountReference, amount]
      properties:
        paymentReference: { $ref: '#/components/schemas/PaymentReference' }
        customerReference: { $ref: '#/components/schemas/CustomerReference' }
        debtorAccountReference: { $ref: '#/components/schemas/AccountReference' }
        amount: { $ref: '#/components/schemas/Money' }
      description: Approved SIXPAY logical binding context; provider-native wire names remain pending.

    VerifyPaymentConfirmationChallengeRequest:
      type: object
      additionalProperties: false
      required: [paymentReference, otp]
      properties:
        paymentReference: { $ref: '#/components/schemas/PaymentReference' }
        otp:
          type: string
          minLength: 1
          writeOnly: true
          description: Transient OTP; bank defines syntax and SIXPAY never persists it.

    ReplacePaymentConfirmationChallengeRequest:
      type: object
      additionalProperties: false
      required: [paymentReference]
      properties:
        paymentReference: { $ref: '#/components/schemas/PaymentReference' }

    RevokePaymentConfirmationChallengeRequest:
      type: object
      additionalProperties: false
      required: [paymentReference, reasonCode]
      properties:
        paymentReference: { $ref: '#/components/schemas/PaymentReference' }
        reasonCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: Final provider-accepted vocabulary remains an external decision.

    BankChallengeStatus:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        Native authoritative Amplitude state. No enum is frozen while La
        Regionale has not supplied wire values. SIXPAY maps these values to its
        normalized ACTIVE, VERIFIED, EXPIRED, LOCKED, REPLACED and REVOKED states.
    BankConfirmationBusinessCode:
      type: string
      minLength: 1
      maxLength: 100
      description: Native provider business code; vocabulary not frozen.
    DeliveryChannel:
      type: string
      enum: [SMS, EMAIL]

    PaymentConfirmationChallengeResult:
      type: object
      additionalProperties: false
      required: [paymentReference, challengeReference, challengeStatus, businessCode]
      properties:
        paymentReference: { $ref: '#/components/schemas/PaymentReference' }
        challengeReference: { type: string, minLength: 1, maxLength: 128 }
        challengeStatus: { $ref: '#/components/schemas/BankChallengeStatus' }
        businessCode: { $ref: '#/components/schemas/BankConfirmationBusinessCode' }
        deliveryChannel: { $ref: '#/components/schemas/DeliveryChannel' }
        sentAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }

    PaymentConfirmationVerificationResult:
      allOf:
        - $ref: '#/components/schemas/PaymentConfirmationChallengeResult'
      description: Positive or negative verification; success does not prove funds or posting.

    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 1000 }
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Provider protocol/error code; vocabulary not frozen.
        correlationId: { type: string, format: uuid }
        retryAfter: { type: integer, minimum: 1 }

  responses:
    BadRequest: &problem
      description: Request cannot be processed at the protocol boundary.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized: *problem
    Forbidden: *problem
    ChallengeNotFound: *problem
    OperationNotFound: *problem
    IdempotencyConflict: *problem
    UnprocessableEntity: *problem
    TooManyRequests: *problem
    InternalServerError: *problem
    ServiceUnavailable: *problem

x-sixpay-idempotency-policy:
  create: { required: true }
  verify:
    required: true
    duplicateReplayConsumesAdditionalOtpAttempt: false
    otpPersistence: FORBIDDEN
    secureRequestEquivalenceStrategy: OPEN_DECISION_SECURITY
  replace: { required: true }
  revoke: { status: OPEN_DECISION }
  sameKeySameRequest:
    result: RETURN_ORIGINAL_RESULT
    duplicateBankAction: FORBIDDEN
  sameKeyDifferentRequest:
    result: CONFLICT
    httpStatus: 409
  unknownOutcome:
    assumeSuccess: FORBIDDEN
    assumeFailure: FORBIDDEN
    lookupBeforeRetry: REQUIRED
    lookupByOriginalIdempotencyKey: REQUIRED
    retryWithNewKey: FORBIDDEN

x-sixpay-sensitive-data:
  otp:
    classification: SECRET_TRANSIENT
    persistenceBySixpay: FORBIDDEN
    response: FORBIDDEN
    audit: FORBIDDEN
    logging: FORBIDDEN
    tracing: FORBIDDEN
    metrics: FORBIDDEN
    events: FORBIDDEN
  destinationContact:
    selectedBy: LA_REGIONALE
    suppliedBySixpay: false

x-sixpay-open-decisions:
  - { id: AMP-CONF-OD01, owner: [LA_REGIONALE], topic: PROVIDER_STATUS_AND_BUSINESS_CODE_VOCABULARY }
  - { id: AMP-CONF-OD02, owner: [LA_REGIONALE], topic: FINAL_PROVIDER_WIRE_FIELD_NAMES_AND_SCHEMAS }
  - { id: AMP-CONF-OD03, owner: [LA_REGIONALE], topic: RESEND_MAXIMUM_AND_COOLDOWN }
  - { id: AMP-CONF-OD04, owner: [LA_REGIONALE], topic: DELIVERY_FAILURE_SEMANTICS }
  - { id: AMP-CONF-OD05, owner: [LA_REGIONALE], topic: REVOKE_IDEMPOTENCY }
  - { id: AMP-CONF-OD06, owner: [LA_REGIONALE, SECURITY], topic: TIMEOUT_RATE_LIMIT_RETRY_AND_OPERATIONAL_SECURITY_PARAMETERS }
  - { id: AMP-CONF-OD07, owner: [SECURITY], topic: SAFE_VERIFY_IDEMPOTENCY_FINGERPRINT }
  - { id: AMP-CONF-OD08, owner: [PAYMENT, ARCHITECTURE, LA_REGIONALE], topic: POST_OTP_ONE_MINUTE_WINDOW_EXPIRY_BEHAVIOR }
