openapi: 3.1.0
info:
  title: SIXPAY CONNECT - TRESOR PAY Authorization Lifecycle Webhook
  version: 1.0.0
  x-sixpay-contract:
    registryId: "tresorpay-authorization-decision-webhook-v1"
    gate: "IA-0R"
    lifecycleStatus: "DEFERRED_FUTURE"
    approvalStatus: "DRAFT"
    generationPolicy: "EXCLUDED"
    domain: "subscription"
    capability: "SUBSCRIPTION_AUTHORIZATION_LIFECYCLE_NOTIFICATION"
    direction: "SIXPAY_TO_TRESOR_PAY"
    systemOfRecord: "TRESOR_PAY"
    mvpIncluded: false
    activationPrerequisite: "EXPLICIT_FUTURE_SUBSCRIPTION_SCOPE_APPROVAL"
  license:
    name: SIXGEN Solutions Proprietary
    url: https://github.com/SIXGEN-Solutions/sixpay-connect/blob/main/LICENSE.md
  description: |
    Deferred outbound webhook retained for the future SIXPAY-assisted
    subscription journey. It is excluded from the MVP and must not trigger code
    generation.

    For the MVP, TRESOR PAY remains the subscription system of record and
    SIXPAY emits no subscription lifecycle decision. Activation requires an
    explicit future-scope decision followed by contract review and approval.

    Security and replay protection:
      * OAuth 2.0 client credentials and mutual TLS authenticate SIXPAY;
      * every request is signed with HMAC-SHA256 using the active webhook
        secret identified by `X-SIXPAY-Signature-Key-ID`;
      * the receiver verifies the signature over the unmodified request body
        before parsing it;
      * the signature timestamp must be inside the accepted five-minute window;
      * an `eventId` is immutable and is reused across all delivery attempts;
      * a previously accepted `eventId` with the same payload is acknowledged
        without repeating the business effect;
      * a previously accepted `eventId` with a different payload is rejected.
servers:
  - url: https://webhooks.tresorpay.example
    description: Environment-specific endpoint registered by TRESOR PAY
security:
  - oauth2ClientCredentials:
      - authorization.lifecycle.receive
    mutualTLS: []
tags:
  - name: Authorization lifecycle
    description: Authorization-request and subscription lifecycle notifications.

paths:
  /webhooks/v1/sixpay/authorization-events:
    post:
      tags:
        - Authorization lifecycle
      operationId: receiveAuthorizationLifecycleEvent
      summary: Receive an authorization lifecycle event from SIXPAY
      description: |
        TRESOR PAY must durably persist the event before returning a success
        response. Returning `204` for an already processed event is required.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/DeliveryAttempt'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/SignatureKeyId'
        - $ref: '#/components/parameters/SignatureTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationLifecycleEvent'
      responses:
        '204':
          description: Event durably accepted or previously processed
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials access token issued to SIXPAY.
      flows:
        clientCredentials:
          tokenUrl: https://identity.tresorpay.example/oauth2/token
          scopes:
            authorization.lifecycle.receive: Receive SIXPAY authorization events
    mutualTLS:
      type: mutualTLS
      description: SIXPAY client certificate trusted by TRESOR PAY.

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: End-to-end identifier, identical to `correlationId` in the body.
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: X-Webhook-Delivery-ID
      in: header
      required: true
      description: |
        Identifier of one delivery attempt. A new value is generated for every
        retry while `eventId` remains unchanged.
      schema:
        type: string
        format: uuid
    DeliveryAttempt:
      name: X-Webhook-Delivery-Attempt
      in: header
      required: true
      description: Attempt number, starting at one.
      schema:
        type: integer
        minimum: 1
        maximum: 8
    Signature:
      name: X-SIXPAY-Signature
      in: header
      required: true
      description: |
        `v1=<base64url-signature>` where the signature is
        `HMAC-SHA256(secret, signingInput)`.

        `signingInput` is the UTF-8 concatenation of:
        `timestamp + "." + HTTP_METHOD + "." + request_target + "." +
        base64url(SHA-256(raw_request_body))`.
      schema:
        type: string
        pattern: '^v1=[A-Za-z0-9_-]{43}$'
    SignatureKeyId:
      name: X-SIXPAY-Signature-Key-ID
      in: header
      required: true
      description: Identifier of the shared secret used for key rotation.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: '^[A-Za-z0-9._-]+$'
    SignatureTimestamp:
      name: X-SIXPAY-Signature-Timestamp
      in: header
      required: true
      description: Unix epoch time in seconds used in the signing input.
      schema:
        type: string
        pattern: '^[0-9]{10}$'

  headers:
    CorrelationId:
      description: End-to-end correlation identifier.
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    AuthorizationLifecycleEvent:
      oneOf:
        - $ref: '#/components/schemas/AuthorizationRequestReceivedEvent'
        - $ref: '#/components/schemas/AuthorizationRequestRejectedEvent'
        - $ref: '#/components/schemas/SubscriptionActivatedEvent'
        - $ref: '#/components/schemas/SubscriptionSuspendedEvent'
        - $ref: '#/components/schemas/SubscriptionReactivatedEvent'
      discriminator:
        propertyName: eventType
        mapping:
          AUTHORIZATION_REQUEST_RECEIVED: '#/components/schemas/AuthorizationRequestReceivedEvent'
          AUTHORIZATION_REQUEST_REJECTED: '#/components/schemas/AuthorizationRequestRejectedEvent'
          SUBSCRIPTION_ACTIVATED: '#/components/schemas/SubscriptionActivatedEvent'
          SUBSCRIPTION_SUSPENDED: '#/components/schemas/SubscriptionSuspendedEvent'
          SUBSCRIPTION_REACTIVATED: '#/components/schemas/SubscriptionReactivatedEvent'

    BaseEvent:
      type: object
      required:
        - schemaVersion
        - eventId
        - occurredAt
        - correlationId
        - tresorPayRequestId
        - subscriptionRequestId
        - financialInstitutionCode
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        eventId:
          type: string
          format: uuid
          description: Immutable event identifier and receiver idempotency key.
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        tresorPayRequestId:
          type: string
          minLength: 1
          maxLength: 100
        subscriptionRequestId:
          type: string
          format: uuid
        financialInstitutionCode:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[A-Z0-9][A-Z0-9._-]+$'
        correlationMetadata:
          $ref: '#/components/schemas/CorrelationMetadata'

    AuthorizationRequestReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required:
            - eventType
            - data
          properties:
            eventType:
              type: string
              const: AUTHORIZATION_REQUEST_RECEIVED
            data:
              $ref: '#/components/schemas/RequestReceivedData'
      unevaluatedProperties: false

    AuthorizationRequestRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required:
            - eventType
            - data
          properties:
            eventType:
              type: string
              const: AUTHORIZATION_REQUEST_REJECTED
            data:
              $ref: '#/components/schemas/RequestRejectedData'
      unevaluatedProperties: false

    SubscriptionActivatedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required:
            - eventType
            - subscriptionId
            - data
          properties:
            eventType:
              type: string
              const: SUBSCRIPTION_ACTIVATED
            subscriptionId:
              type: string
              format: uuid
            data:
              $ref: '#/components/schemas/SubscriptionActivatedData'
      unevaluatedProperties: false

    SubscriptionSuspendedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required:
            - eventType
            - subscriptionId
            - data
          properties:
            eventType:
              type: string
              const: SUBSCRIPTION_SUSPENDED
            subscriptionId:
              type: string
              format: uuid
            data:
              $ref: '#/components/schemas/SubscriptionSuspendedData'
      unevaluatedProperties: false

    SubscriptionReactivatedEvent:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          required:
            - eventType
            - subscriptionId
            - data
          properties:
            eventType:
              type: string
              const: SUBSCRIPTION_REACTIVATED
            subscriptionId:
              type: string
              format: uuid
            data:
              $ref: '#/components/schemas/SubscriptionReactivatedData'
      unevaluatedProperties: false

    RequestReceivedData:
      type: object
      additionalProperties: false
      required:
        - status
        - receivedAt
      properties:
        status:
          type: string
          const: RECEIVED
        receivedAt:
          type: string
          format: date-time

    RequestRejectedData:
      type: object
      additionalProperties: false
      required:
        - status
        - rejectedAt
        - reason
      properties:
        status:
          type: string
          const: REJECTED
        rejectedAt:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/DecisionReason'
        decidedBy:
          $ref: '#/components/schemas/DecisionActor'

    SubscriptionActivatedData:
      type: object
      additionalProperties: false
      required:
        - status
        - activatedAt
        - subscriptionKey
      properties:
        status:
          type: string
          const: ACTIVE
        activatedAt:
          type: string
          format: date-time
        subscriptionKey:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: |
            Sensitive SIXPAY credential. It must never appear in logs, traces,
            metrics, error responses or subsequent lifecycle events.
        decidedBy:
          $ref: '#/components/schemas/DecisionActor'

    SubscriptionSuspendedData:
      type: object
      additionalProperties: false
      required:
        - status
        - suspendedAt
        - reason
      properties:
        status:
          type: string
          const: SUSPENDED
        suspendedAt:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/DecisionReason'
        decidedBy:
          $ref: '#/components/schemas/DecisionActor'

    SubscriptionReactivatedData:
      type: object
      additionalProperties: false
      required:
        - status
        - reactivatedAt
      properties:
        status:
          type: string
          const: ACTIVE
        reactivatedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/DecisionActor'

    DecisionReason:
      type: object
      additionalProperties: false
      required:
        - code
        - label
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Z][A-Z0-9._-]+$'
          description: Stable business code without sensitive KYC information.
        label:
          type: string
          minLength: 1
          maxLength: 200

    DecisionActor:
      type: object
      additionalProperties: false
      required:
        - actorId
        - displayName
      properties:
        actorId:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    CorrelationMetadata:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          maxLength: 100
        causationId:
          type: string
          maxLength: 100
        sourceEventId:
          type: string
          maxLength: 100

    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - WEBHOOK_REQUEST_INVALID
            - WEBHOOK_AUTHENTICATION_FAILED
            - WEBHOOK_SIGNATURE_INVALID
            - WEBHOOK_SIGNATURE_EXPIRED
            - EVENT_ID_CONFLICT
            - EVENT_TYPE_UNSUPPORTED
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        correlationId:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Malformed headers or payload
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: OAuth 2.0, mTLS or webhook signature validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The event identifier was previously used with another payload
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Event type or business payload is not supported
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Delivery temporarily rate-limited
      headers:
        Retry-After:
          description: Delay in seconds before retry
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Temporary receiver failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: Receiver unavailable
      headers:
        Retry-After:
          description: Delay in seconds before retry
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

x-sixpay-signature-profile:
  version: v1
  algorithm: HMAC-SHA256
  bodyDigest: SHA-256
  bodyEncoding: raw-unmodified-bytes
  digestEncoding: base64url-without-padding
  signatureEncoding: base64url-without-padding
  timestampUnit: unix-seconds
  acceptedClockSkewSeconds: 300
  comparison: constant-time
  secretRotation:
    keyIdentifierHeader: X-SIXPAY-Signature-Key-ID
    overlappingValidityRequired: true

x-sixpay-replay-protection:
  eventIdRetentionDays: 30
  deduplicationScope: webhook-endpoint-and-event-id
  duplicateSamePayload:
    status: 204
    repeatBusinessEffect: false
  duplicateDifferentPayload:
    status: 409
    code: EVENT_ID_CONFLICT
  rejectExpiredSignature:
    status: 401
    code: WEBHOOK_SIGNATURE_EXPIRED

x-sixpay-webhook-delivery-policy:
  totalDeliveryAttempts: 8
  schedule:
    - PT0S
    - PT5S
    - PT30S
    - PT2M
    - PT10M
    - PT30M
    - PT2H
    - PT6H
  backoff: exponential-with-full-jitter
  honorRetryAfter: true
  successfulStatuses:
    - 200
    - 202
    - 204
  retryableStatuses:
    - 408
    - 425
    - 429
    - 500
    - 502
    - 503
    - 504
  nonRetryableStatuses:
    - 400
    - 401
    - 403
    - 404
    - 409
    - 410
    - 422
  deadLetterQueue:
    afterExhaustion: true
    retentionDays: 90
    preserveEventAndDeliveryHistory: true
  manualReplay:
    allowedFromDlq: true
    audited: true
    preserveEventId: true
    generateNewDeliveryId: true
