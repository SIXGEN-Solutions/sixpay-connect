openapi: 3.1.0
info:
  title: SIXPAY CONNECT - TRESOR PAY Authorization Request API
  version: 1.0.0
  license:
    name: SIXGEN Solutions Proprietary
    url: https://github.com/SIXGEN-Solutions/sixpay-connect/blob/main/LICENSE.md
  description: |
    Frozen contract for authorization requests pushed by TRESOR PAY to SIXPAY.

    Transport authentication uses OAuth 2.0 client credentials and mutual TLS.
    The `authorizationToken` carried in the payload is a TRESOR PAY business
    credential and is distinct from the OAuth 2.0 access token.

    Replay rules:
      * the same `Idempotency-Key` and the same canonical payload return the
        original acknowledgement without creating another subscription request;
      * the same `Idempotency-Key` with a different canonical payload returns
        `409 IDEMPOTENCY_KEY_REUSED`;
      * the same `tresorPayRequestId` with an equivalent payload is treated as a
        replay, even when a new idempotency key is supplied;
      * the same `tresorPayRequestId` with a different payload returns
        `409 EXTERNAL_REQUEST_CONFLICT`.
servers:
  - url: https://api.sixpay.example
    description: Environment-specific SIXPAY endpoint
security:
  - oauth2ClientCredentials:
      - tresorpay.authorization.request.write
    mutualTLS: []
tags:
  - name: TRESOR PAY authorization requests
    description: Requests pushed by the authenticated TRESOR PAY integration.

paths:
  /api/v1/integrations/tresorpay/authorization-requests:
    post:
      tags:
        - TRESOR PAY authorization requests
      operationId: receiveTresorPayAuthorizationRequest
      summary: Receive an authorization request from TRESOR PAY
      description: |
        Accepts a request asynchronously. A `202` acknowledgement confirms
        durable receipt and does not mean that KYC, bank-account verification
        or subscription approval has succeeded.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '202':
          description: |
            Request durably accepted for asynchronous processing. The same
            response is returned for an accepted replay.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Location:
              description: URI of the SIXPAY subscription request resource
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationRequestAcknowledgement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 client credentials access token issued to TRESOR PAY.
      flows:
        clientCredentials:
          tokenUrl: https://identity.sixpay.example/oauth2/token
          scopes:
            tresorpay.authorization.request.write: Push authorization requests
    mutualTLS:
      type: mutualTLS
      description: |
        TLS client certificate issued to TRESOR PAY. Certificate identity must
        be bound to the OAuth 2.0 client.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Opaque key generated by TRESOR PAY for this logical mutation. It must
        remain stable across transport retries.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      example: 8de5ef1b-8541-4f72-aa14-3f3e1f1ca147
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: End-to-end correlation identifier propagated unchanged.
      schema:
        type: string
        format: uuid
      example: b458d7fa-09c8-4bfe-b798-94b919db73c5

  headers:
    CorrelationId:
      description: End-to-end correlation identifier.
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: "'true' when this acknowledgement comes from a prior result."
      required: true
      schema:
        type: boolean

  schemas:
    AuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - tresorPayRequestId
        - authorizationToken
        - customer
        - financialInstitutionCode
        - accountReference
        - mandateReference
        - requestedAt
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        tresorPayRequestId:
          type: string
          minLength: 1
          maxLength: 100
          description: Immutable request identifier generated by TRESOR PAY.
        authorizationToken:
          type: string
          minLength: 16
          maxLength: 2048
          writeOnly: true
          description: |
            Opaque TRESOR PAY business authorization token. SIXPAY must never
            return it in responses, errors, traces or logs.
        customer:
          $ref: '#/components/schemas/CustomerIdentity'
        financialInstitutionCode:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[A-Z0-9][A-Z0-9._-]+$'
        accountReference:
          $ref: '#/components/schemas/AccountReference'
        mandateReference:
          type: string
          minLength: 1
          maxLength: 100
          description: Reference of the signed mandate managed by SIXPAY.
        requestedAt:
          type: string
          format: date-time
        correlationMetadata:
          $ref: '#/components/schemas/CorrelationMetadata'
        extensions:
          type: object
          description: |
            Namespaced, non-critical attributes agreed by contract. Unknown
            extensions must not alter authorization semantics.
          propertyNames:
            pattern: '^[a-z][a-z0-9.-]{2,63}$'
          additionalProperties: true

    CustomerIdentity:
      type: object
      additionalProperties: false
      required:
        - niu
        - legalName
        - phoneNumber
        - email
      properties:
        niu:
          type: string
          minLength: 1
          maxLength: 50
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        phoneNumber:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Telephone number in E.164 format.
        email:
          type: string
          format: email
          maxLength: 254
        additionalKycAttributes:
          type: object
          description: |
            Optional KYC attributes accepted by configuration. They remain
            claims to verify against Amplitude and are not proof of identity.
          propertyNames:
            pattern: '^[a-z][A-Za-z0-9]{1,63}$'
          additionalProperties:
            type:
              - string
              - number
              - integer
              - boolean

    AccountReference:
      type: object
      additionalProperties: false
      description: |
        At least one of `rib`, `iban` or `customerNumber` is required. If
        several are supplied, they must identify the same account holder in
        the named financial institution.
      properties:
        rib:
          type: string
          minLength: 10
          maxLength: 50
          writeOnly: true
        iban:
          type: string
          minLength: 15
          maxLength: 34
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
          writeOnly: true
        customerNumber:
          type: string
          minLength: 1
          maxLength: 50
          writeOnly: true
      anyOf:
        - required: [rib]
        - required: [iban]
        - required: [customerNumber]

    CorrelationMetadata:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          maxLength: 100
        causationId:
          type: string
          maxLength: 100
        sourceEventId:
          type: string
          maxLength: 100
        sourceChannel:
          type: string
          maxLength: 50

    AuthorizationRequestAcknowledgement:
      type: object
      additionalProperties: false
      required:
        - acknowledgementId
        - tresorPayRequestId
        - subscriptionRequestId
        - status
        - receivedAt
        - correlationId
      properties:
        acknowledgementId:
          type: string
          format: uuid
        tresorPayRequestId:
          type: string
        subscriptionRequestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - RECEIVED
        receivedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid

    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable SIXPAY error code.
          enum:
            - REQUEST_INVALID
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - IDEMPOTENCY_KEY_REUSED
            - EXTERNAL_REQUEST_CONFLICT
            - CONTENT_TYPE_UNSUPPORTED
            - AUTHORIZATION_TOKEN_INVALID
            - FINANCIAL_INSTITUTION_UNKNOWN
            - ACCOUNT_REFERENCE_INVALID
            - MANDATE_REFERENCE_INVALID
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        correlationId:
          type: string
          format: uuid
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParameter'

    InvalidParameter:
      type: object
      additionalProperties: false
      required:
        - name
        - reason
      properties:
        name:
          type: string
        reason:
          type: string

  responses:
    BadRequest:
      description: Malformed request, header or JSON payload
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: OAuth 2.0 token or client certificate is missing or invalid
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated client is not authorized for the operation
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Idempotency-key or external-request conflict
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Payload is syntactically valid but violates contract semantics
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: TRESOR PAY request rate exceeded
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          description: Delay in seconds before retry
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Unexpected SIXPAY failure
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: SIXPAY cannot durably accept the request
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          description: Delay in seconds before retry
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

x-sixpay-replay-policy:
  idempotencyScope: oauth-client-and-operation
  canonicalPayloadComparison: true
  successfulReplay:
    status: 202
    returnOriginalAcknowledgement: true
    responseHeader: Idempotency-Replayed
  conflictingReplay:
    status: 409
    codes:
      - IDEMPOTENCY_KEY_REUSED
      - EXTERNAL_REQUEST_CONFLICT
  retryableStatuses:
    - 429
    - 500
    - 503
  nonRetryableStatuses:
    - 400
    - 401
    - 403
    - 409
    - 415
    - 422
  retention: configurable-and-not-shorter-than-the-business-processing-window
