openapi: 3.1.0
info:
  title: SIXPAY CONNECT - Payment Recovery API
  version: 1.0.0
  description: |
    Read-only legacy recovery endpoint implemented by TresorPayPaymentRecoveryController.
    Payment initiation is exclusively POST /v1/payments/initiate and is defined
    by documentation/contracts/external/payment-command-api-v1.yaml.
    Customer owns CustomerSubscription; the recovery endpoint never validates
    subscriptions, creates OTP challenges or initiates a financial operation.
  x-sixpay-contract:
    registryId: tresorpay-payment-request-api-v1
    lifecycleStatus: ACTIVE_MVP
    approvalStatus: APPROVED
    generationPolicy: REFERENCE_ONLY
    codeGenerationAllowed: false
    domain: payment
    capability: PAYMENT_RECOVERY
    direction: TRESOR_PAY_TO_SIXPAY
servers:
  - url: https://api.sixpay.example
security:
  - bearerAuth: []
tags:
  - name: TRESOR PAY payments
paths:
  /api/v1/integrations/tresorpay/payments/{paymentReference}:
    get:
      tags: [TRESOR PAY payments]
      operationId: getTresorPayPayment
      summary: Recover current Payment state (read-only)
      description: Does not initiate payment, verify customer or trigger OTP or posting.
      parameters:
        - name: paymentReference
          in: path
          required: true
          schema:
            type: string
            pattern: '^PAY-[0-9A-HJKMNP-TV-Z]{26}$'
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current Payment recovery projection
          headers:
            X-Correlation-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecoveryResponse'
        '404':
          description: Payment not found
        '401':
          description: Authentication required
        '403':
          description: Access forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentRecoveryResponse:
      type: object
      required: [paymentId, paymentReference, tresorPayPaymentReference, status, amount, receivedAt, updatedAt]
      properties:
        paymentId: {type: string, format: uuid}
        paymentReference: {type: string, pattern: '^PAY-[0-9A-HJKMNP-TV-Z]{26}$'}
        tresorPayPaymentReference: {type: string}
        status: {type: string}
        amount:
          type: object
          required: [amount, currency]
          properties:
            amount: {type: number}
            currency: {type: string}
        receivedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finalizedAt: {type: [string, 'null'], format: date-time}
