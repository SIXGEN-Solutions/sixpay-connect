contract: tresorpay-public-error-catalogue
version: 1.0.0
status: IMPLEMENTATION_BASELINE
contentType: application/problem+json
requiredFields:
  - type
  - title
  - status
  - code
  - correlationId
  - detail
errors:
  INVALID_REQUEST: {status: 400, retryable: false}
  MISSING_HEADER: {status: 400, retryable: false}
  INVALID_IDEMPOTENCY_KEY: {status: 400, retryable: false}
  INVALID_CALLBACK_URL: {status: 400, retryable: false}
  INVALID_BENEFICIARY_TOTAL: {status: 400, retryable: false}
  AUTHENTICATION_REQUIRED: {status: 401, retryable: false}
  INVALID_ACCESS_TOKEN: {status: 401, retryable: false}
  INVALID_CLIENT_CERTIFICATE: {status: 401, retryable: false}
  API_KEY_INVALID: {status: 401, retryable: false}
  REQUEST_TIMESTAMP_INVALID: {status: 401, retryable: false}
  PARTNER_NOT_AUTHORIZED: {status: 403, retryable: false}
  PARTNER_IDENTITY_MISMATCH: {status: 403, retryable: false}
  SCOPE_NOT_GRANTED: {status: 403, retryable: false}
  CALLBACK_URL_NOT_ALLOWED: {status: 403, retryable: false}
  REPLAY_DETECTED: {status: 409, retryable: false}
  IDEMPOTENCY_KEY_CONFLICT: {status: 409, retryable: false}
  END_TO_END_ID_CONFLICT: {status: 409, retryable: false}
  PAYMENT_INITIATION_IN_PROGRESS: {status: 409, retryable: true}
  RATE_LIMIT_EXCEEDED: {status: 429, retryable: true, retryAfterRequired: true}
  BANKING_SERVICE_UNAVAILABLE: {status: 503, retryable: true, retryAfterRequired: true}
  PAYMENT_PROCESSING_UNAVAILABLE: {status: 503, retryable: true, retryAfterRequired: true}
