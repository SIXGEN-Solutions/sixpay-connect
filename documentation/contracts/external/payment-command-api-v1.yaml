openapi: 3.1.0
info:
  title: SIXPAY CONNECT - TresorPay Payment Command API
  version: 1.0.0
  description: |
    Official partner-facing command contract used by TresorPay to initiate one
    debit order through SIXPAY CONNECT. Authentication requires an OAuth 2.0 client-credentials JWT;
    mTLS is optional at the API contract level. APIKey and PIN are forbidden from
    the JSON payload. The initial response is AWAITING_OTP after an ACTIVE
    bank-owned OTP challenge, and callbacks are asynchronous.
    The callback payload, event types, HMAC-SHA256 signature and HTTP 204
    durable acknowledgement are defined exclusively by
    documentation/contracts/tresorpay/tresorpay-payment-callback-webhook-v1.yaml.
    The confirmation read, verify and resend operations continue to use
    the same machine-to-machine client-credentials security boundary,
    with independent operation scopes and Payment Partner ownership checks.
  x-sixpay-contract:
    registryId: payment-command-api-v1
    phase: "3"
    lot: "3.16"
    lifecycleStatus: ACTIVE_MVP
    approvalStatus: APPROVED
    generationPolicy: ACTIVE
    codeGenerationAllowed: true
    domain: payment
    capability: PAYMENT_INITIATION
    direction: TRESORPAY_TO_SIXPAY
    dataClassification: RESTRICTED
    idempotent: true
    callbackMode: ASYNCHRONOUS
servers:
  - url: https://api.banque.com
security:
  - oauth2: [payment.initiate]
tags:
  - name: Payment Commands
paths:
  /api/v1/payments/initiate:
    post:
      tags: [Payment Commands]
      operationId: initiateDebit
      summary: Initiate a debit order
      description: |
        Idempotency-Key identifies the HTTP replay boundary. endToEndId is the
        durable business reference; both values are independent. referenceClient
        is required. AppID is a required declared Partner identifier and is
        required to match the authenticated Partner. LoginName
        is optional compatibility metadata. The independent transport header
        X-TresorPay-App-Id remains required. Beneficiary amounts must sum
        exactly to montantTotal when supplied. NUI is optional compatibility input. referenceClient carries the banking customerReference obtained at enrollment. SIXPAY resolves the unique ACTIVE CustomerSubscription for the authenticated Partner and retains its subscriptionId internally before continuing the unchanged banking verification and OTP flow.
        The callback is never executed in this HTTP transaction.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
        - $ref: '#/components/parameters/OptionalCorrelationId'
        - $ref: '#/components/parameters/RequiredTresorPayAppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateDebitRequest'
            example:
              LoginName: TRESOR_PAY
              AppID: TP_APP_001
              referenceClient: "0494223"
              endToEndId: AVI-2025-00045678
              montantTotal: 600000
              devise: XAF
              ribDebiteur: 10005-00001-12345678901-12
              nomDebiteur: Société ABC SARL
              typeCreance: AVI
              NUI: "100200300"
              dateExecution: "2025-07-24T10:30:00Z"
              beneficiaires:
                - rib: 10005-00001-000000TRESDGI-97
                  montant: 300000
                - rib: 10005-00001-000000TRESDOUANE-11
                  montant: 200000
                - rib: 10005-00001-000000TRESDOMAINE-22
                  montant: 100000
              callbackURL: https://tresorpay.cm/v1/callbacks/payment-status
      responses:
        '200':
          description: Payment order initiated and awaiting customer confirmation
          headers:
            X-Correlation-ID:
              required: true
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateDebitResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-sixpay-callback-contract:
        canonicalPath: documentation/contracts/tresorpay/tresorpay-payment-callback-webhook-v1.yaml
        delivery: AT_LEAST_ONCE
        signature: HMAC-SHA256
        durableAcknowledgement: 204
        eventTypes: [CUT_CREDITED, PAYMENT_REJECTED, TREASURY_INTEGRATED]
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.banque.com/oauth2/token
          scopes:
            payment.initiate: Initiate debit orders through SIXPAY CONNECT
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    RequiredTresorPayAppId:
      name: X-TresorPay-App-Id
      in: header
      required: true
      description: Independent transport application identifier; not the business AppID.
      schema: {type: string, minLength: 1, maxLength: 64}
    OptionalCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Missing, malformed or invalid request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    Unauthorized:
      description: OAuth 2.0 authentication failed
    Forbidden:
      description: Partner is not authorized
    Conflict:
      description: Idempotency or business-reference conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    UnprocessableEntity:
      description: Payment business rule rejected the command
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetail'}
    TooManyRequests:
      description: Partner rate limit exceeded
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
    ServiceUnavailable:
      description: Required banking capability unavailable
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
  schemas:
    InitiateDebitRequest:
      type: object
      additionalProperties: false
      required:
        - referenceClient
        - AppID
        - endToEndId
        - montantTotal
        - typeCreance
        - callbackURL
      properties:
        LoginName:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional non-authenticating compatibility metadata
        referenceClient:
          type: string
          minLength: 1
          maxLength: 128
          description: Banking customerReference established during Customer enrollment (not a subscription UUID). SIXPAY resolves the ACTIVE CustomerSubscription for the authenticated Partner. Missing, inactive or ambiguous matches are rejected without revealing subscription ownership.
          example: "0494223"
        AppID:
          type: string
          minLength: 1
          maxLength: 64
          description: Required Partner business identifier; validated against the authenticated Partner
        endToEndId:
          type: string
          minLength: 1
          maxLength: 128
        montantTotal:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        devise:
          type: string
          pattern: '^[A-Z]{3}$'
          default: XAF
        ribDebiteur:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9-]+$'
        nomDebiteur:
          type: string
          minLength: 1
          maxLength: 200
          description: Verified by the bank
        typeCreance:
          type: string
          enum: [AVI, IM7, RNF]
        NUI:
          type: string
          minLength: 1
          maxLength: 64
        dateExecution:
          type: string
          format: date-time
          description: Verified by the bank
        beneficiaires:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/BeneficiaireRequest'}
          description: Optional allocation; when present, exact sum must equal montantTotal
        callbackURL:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Must match the partner callback allowlist
    BeneficiaireRequest:
      type: object
      additionalProperties: false
      required: [rib, montant]
      properties:
        rib:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9-]+$'
        montant:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: number, minimum: 0, multipleOf: 0.01}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    InitiateDebitResponse:
      type: object
      additionalProperties: false
      required:
        - OK
        - Description
        - Result
        - paymentReference
        - endToEndId
        - montantTotal
        - Date
        - Status
        - NextStep
      properties:
        OK: {type: string, const: "200"}
        Description: {type: string}
        Result: {type: string, const: Success}
        paymentReference:
          type: string
          pattern: '^PAY-[0-9A-HJKMNP-TV-Z]{26}$'
        endToEndId: {type: string}
        bankOperationId: {type: string, minLength: 1, maxLength: 128}
        montantTotal: {$ref: '#/components/schemas/Money'}
        frais: {$ref: '#/components/schemas/Money'}
        montantNet: {$ref: '#/components/schemas/Money'}
        Date: {type: string, format: date-time}
        ValidityInMinutes: {type: integer, minimum: 1}
        TransactionNumber: {type: string, minLength: 1, maxLength: 128}
        TransactionQRCode: {type: string, format: uri}
        Status: {type: string, const: AWAITING_OTP}
        NextStep:
          type: string
          const: Awaiting customer confirmation via OTP/SMS
    PaymentStatus:
      type: string
      enum:
        - RECEIVED
        - PENDING_CONFIRMATION
        - AUTHORIZATION_CHECKING
        - BANKING_VERIFICATION_PENDING
        - FUNDS_CONTROL_PENDING
        - TREASURY_ACCOUNT_RESOLUTION_PENDING
        - APPROVED_FOR_POSTING
        - POSTING_PENDING
        - POSTING_OUTCOME_UNKNOWN
        - DEBIT_CONFIRMED
        - POSTED_PENDING_TFJ
        - REVERSAL_REQUIRED
        - REVERSAL_PENDING
        - REVERSAL_OUTCOME_UNKNOWN
        - REJECTED
        - FAILED
        - TREASURY_INTEGRATED
        - REVERSED
    ProblemDetail:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        correlationId: {type: string, format: uuid}
        code: {type: [string, 'null']}
